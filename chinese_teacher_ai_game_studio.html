<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Teacher AI Game Studio</title>
<!-- Font giao diện (Inter) và chữ Hán (Noto Sans SC). Nếu không tải được, trình duyệt dùng font hệ thống thay thế. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0fb3a3;--teal-d:#0a8a7e;--teal-l:#d9f6f2;
  --sky:#e3f3fd;--sky-d:#5fb4e8;
  --violet:#8f80f3;--violet-l:#efecfe;
  --bg:#f4f9fa;--card:#ffffff;--ink:#123540;--muted:#5d7883;--line:#d9e7eb;
  --ok:#14a058;--ok-l:#dcf7e8;--bad:#e1484d;--bad-l:#fde6e6;--warn:#e79a0c;--warn-l:#fff3d6;
  --side:#0f3f4a;--side2:#135563;
  --r-s:8px;--r-m:12px;--r-l:20px;
  --zh:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.zh{font-family:var(--zh)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
#sidebar{width:232px;background:var(--side);color:#e3f4f5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:40}
.brand{padding:18px 16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.seal{width:42px;height:42px;border-radius:11px;background:var(--teal);display:grid;place-items:center;font-family:var(--zh);font-weight:900;font-size:24px;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.brand b{display:block;font-size:13.5px;line-height:1.25}
.brand small{opacity:.65;font-size:11.5px}
#nav{flex:1;overflow:auto;padding:10px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#cfe8ea;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:14px}
#nav button .ic{width:22px;text-align:center;font-size:16px}
#nav button:hover{background:rgba(255,255,255,.07);color:#fff}
#nav button.active{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.side-foot{padding:12px 14px;font-size:12px;border-top:1px solid rgba(255,255,255,.08);color:#a9cfd3}
.side-foot .pill{display:inline-block;margin:2px 4px 2px 0}
/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(244,249,250,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;margin:0;font-weight:700;flex:1}
#menuBtn{display:none}
#view,#roomView{padding:22px 24px 40px;max-width:1500px;width:100%}
/* ---------- Primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal-d)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d);color:#fff}
.btn.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;display:inline-grid;place-items:center}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
textarea{resize:vertical;line-height:1.6}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;margin:3px 12px 3px 0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sky);color:#1d6b97;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.bad{background:var(--bad-l);color:var(--bad)}.pill.warn{background:var(--warn-l);color:#9a6400}.pill.v{background:var(--violet-l);color:#5a49c9}.pill.t{background:var(--teal-l);color:var(--teal-d)}
.stat{padding:16px 18px}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:#f8fbfc;position:sticky;top:0}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:#fafdfd}
.tablewrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:var(--r-m)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:34px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.active{color:var(--teal-d);border-color:var(--teal)}
.notice{padding:11px 14px;border-radius:var(--r-m);background:var(--sky);font-size:14px}
.notice.warn{background:var(--warn-l)}.notice.bad{background:var(--bad-l)}.notice.ok{background:var(--ok-l)}
.flow{display:flex;gap:8px;flex-wrap:wrap;counter-reset:s}
.flow span{counter-increment:s;font-size:13px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.flow span::before{content:counter(s) ". ";font-weight:700;color:var(--teal-d)}
/* ---------- Dashboard hero ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch}
.hero .lead{background:var(--side);color:#e8f7f8;border-radius:var(--r-l);padding:24px 26px;position:relative;overflow:hidden}
.hero .lead h2{margin:0 0 8px;font-size:24px;line-height:1.25}
.hero .lead p{margin:0 0 16px;color:#b9dadd;max-width:56ch}
.hero .lead .bigzh{position:absolute;right:-6px;bottom:-34px;font-family:var(--zh);font-weight:900;font-size:170px;line-height:1;color:rgba(255,255,255,.06);pointer-events:none}
/* ---------- Generator ---------- */
.gen-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
#srcText{min-height:300px;font-family:var(--zh),var(--ui);font-size:15px}
.qcard{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:#fff}
.qcard+.qcard{margin-top:10px}
.qcard .stem{font-weight:600}
.qcard .zhbig{font-family:var(--zh);font-size:22px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opts span{padding:3px 10px;border-radius:8px;background:#f2f7f8;font-family:var(--zh),var(--ui);font-size:14px}
.opts span.c{background:var(--ok-l);color:var(--ok);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
/* ---------- Game library ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{border:1px solid var(--line);border-radius:var(--r-l);background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.gcard:hover{border-color:var(--teal)}
.gcard .gi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--teal-l)}
.gcard h4{margin:0;font-size:15.5px}
.gcard p{margin:0;font-size:13px;color:var(--muted);flex:1}
/* ---------- Room / Stage ---------- */
.room-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.room-top .gtitle{font-size:18px;font-weight:700;flex:1;min-width:200px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13px;color:var(--muted)}
.hud b{color:var(--ink);font-size:17px;margin-left:4px}
.room-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 150px);background:radial-gradient(ellipse at 30% 20%,#1d6f7c,#0d3540 70%);border-radius:var(--r-l);overflow:hidden;user-select:none;touch-action:none}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .3s}
#camVideo.on{opacity:1}
#stage.dim #camVideo{filter:brightness(.62) saturate(.9)}
#gameCanvas,#lmCanvas{position:absolute;inset:0;width:100%;height:100%}
#lmCanvas{pointer-events:none}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(calc(100% - 170px),880px);background:rgba(255,255,255,.95);border-radius:16px;padding:10px 18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.18);pointer-events:auto;display:none;z-index:5}
#banner .bstem{font-size:clamp(13px,1.6vw,17px);color:var(--muted);font-weight:600}
#banner .bzh{font-family:var(--zh);font-size:clamp(28px,4.4vw,54px);font-weight:700;line-height:1.2;color:var(--ink)}
#banner .bsub{font-size:clamp(13px,1.6vw,17px)}
#banner .bpy{color:var(--teal-d);font-weight:600;margin-right:10px}
#banner .bplayer{position:absolute;left:12px;top:8px;font-size:12px}
#banner .bspeak{position:absolute;right:10px;top:8px}
#stageOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:rgba(9,40,48,.55);padding:16px}
#stageOverlay.show{display:flex}
.ovbox{background:#fff;border-radius:var(--r-l);padding:22px 26px;max-width:620px;width:100%;max-height:100%;overflow:auto;text-align:center}
.ovbox h2{margin:0 0 8px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.fbmark{font-size:58px;line-height:1}
#camStatus{position:absolute;left:10px;bottom:10px;z-index:6;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#camStatus .pill{background:rgba(255,255,255,.9)}
.timer{position:absolute;right:12px;top:12px;z-index:6;width:58px;height:58px}
.side-panel .card{padding:14px}
.side-panel .card+.card{margin-top:12px}
.side-panel h4{margin:0 0 8px;font-size:14px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctl .btn{justify-content:center;padding:8px 6px;font-size:13px}
.answer-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.answer-btns .btn{font-family:var(--zh),var(--ui);font-size:17px}
/* ---------- Modal / toast ---------- */
#modalRoot .back{position:fixed;inset:0;background:rgba(10,35,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#modalRoot .modal{background:#fff;border-radius:var(--r-l);width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modalRoot .modal.wide{width:min(980px,100%)}
#modalRoot .modal h2{margin:0 0 14px;font-size:19px}
#modalRoot .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toastRoot{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,92vw)}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .25s ease}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.warn{background:#9a6400}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
.busy{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- Responsive ---------- */
@media (max-width:1100px){.room-body{grid-template-columns:1fr}.gen-layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  #sidebar{position:fixed;left:0;transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:none;box-shadow:0 0 50px rgba(0,0,0,.3)}
  #menuBtn{display:inline-grid}
  #view,#roomView{padding:14px}
  .g2,.g3{grid-template-columns:1fr}
  .topbar{padding:10px 14px}
}
@media print{
  #sidebar,.topbar,.noprint,#toastRoot{display:none!important}
  body{background:#fff}
  .card{border:0;padding:0}
  .tablewrap{max-height:none;overflow:visible;border:0}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Điều hướng">
    <div class="brand"><div class="seal">汉</div><div><b>Chinese Teacher<br>AI Game Studio</b><small>Công cụ lớp học tiếng Trung</small></div></div>
    <div id="nav" role="navigation"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div id="main">
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Mở menu">☰</button>
      <h1 id="pageTitle">Tổng quan</h1>
      <button class="iconbtn" id="muteBtn" title="Bật/tắt âm thanh" aria-label="Bật/tắt âm thanh">🔊</button>
    </header>
    <section id="view" aria-live="polite"></section>
    <section id="roomView" hidden>
      <div class="room-top">
        <div class="gtitle" id="roomTitle">Phòng chơi camera</div>
        <div class="hud" id="hud"></div>
      </div>
      <div class="room-body">
        <div>
          <div id="stage">
            <video id="camVideo" playsinline muted></video>
            <canvas id="gameCanvas"></canvas>
            <canvas id="lmCanvas"></canvas>
            <div id="banner"></div>
            <svg class="timer" id="timerRing" viewBox="0 0 60 60" style="display:none"><circle cx="30" cy="30" r="26" fill="rgba(255,255,255,.92)"/><circle id="timerArc" cx="30" cy="30" r="22" fill="none" stroke="#0fb3a3" stroke-width="6" stroke-linecap="round" transform="rotate(-90 30 30)" stroke-dasharray="138.2" stroke-dashoffset="0"/><text id="timerTxt" x="30" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#123540">0</text></svg>
            <div id="camStatus"></div>
            <div id="stageOverlay"></div>
          </div>
          <p class="tiny muted noprint" id="stageHint" style="margin:8px 2px 0"></p>
        </div>
        <div class="side-panel" id="roomSide"></div>
      </div>
    </section>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" role="status"></div>
<canvas id="confetti"></canvas>
<script>
/* =====================================================================
   CORE — logic thuần (không truy cập DOM) để có thể kiểm thử độc lập.
   Gồm: tiện ích, xử lý pinyin, dữ liệu HSK mẫu, bộ phân tích văn bản,
   bộ phân loại, bộ sinh câu hỏi, bộ chuyển đổi câu hỏi cho trò chơi, CSV.
   ===================================================================== */
const Core = (() => {
  'use strict';

  /* ---------- Tiện ích chung ---------- */
  const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uniq = (arr) => [...new Set(arr)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const HAN = /[\u3400-\u9fff\uf900-\ufaff]/;
  const HAN_G = /[\u3400-\u9fff\uf900-\ufaff]/g;
  const hanCount = (s) => (String(s).match(HAN_G) || []).length;
  const ZH_PUNCT = /[。！？，、；：“”‘’（）《》…—．!?,;:.\s]/g;

  /* ---------- PINYIN ---------- */
  const TONES = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };
  const MARK2 = {}; // ký tự có dấu -> [nguyên âm gốc, thanh]
  Object.entries(TONES).forEach(([b, s]) => { [...s].forEach((c, i) => { MARK2[c] = [b, i + 1]; MARK2[c.toUpperCase()] = [b.toUpperCase(), i + 1]; }); });
  const PY_ONLY = /[āǎēěīǐōǒūǔǖǘǚǜüĀǍĒĚĪǏŌǑŪǓÜ]/;
  const VI_ONLY = /[ăâđêôơưạảãẹẻẽịỉĩọỏõụủũỳỷỹýấầẩẫậắằẳẵặếềểễệốồổỗộớờởỡợứừửữự]/i;

  const stripTones = (s) => [...String(s)].map(c => (MARK2[c] ? MARK2[c][0] : c)).join('');
  // Nhận diện âm tiết pinyin hợp lệ (không dấu) — đủ dùng để tách âm tiết
  const SYL_RE = /^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(iang|iong|uang|ueng|ang|eng|ing|ong|ian|iao|uai|uan|üan|van|ai|ei|ao|ou|an|en|er|in|un|ün|vn|ia|ie|iu|ua|uo|ue|üe|ve|ui|a|o|e|i|u|ü|v)r?$/;
  const isSyl = (s) => SYL_RE.test(s);

  /** Tách chuỗi pinyin (có/không dấu, viết liền hoặc cách) thành mảng âm tiết, giữ nguyên dấu thanh */
  function splitSyllables(py) {
    const out = [];
    String(py).trim().split(/[\s'’·\-]+/).filter(Boolean).forEach(tok => {
      const t = tok.replace(/[^A-Za-zÀ-ɏüÜ0-5]/g, '');
      if (!t) return;
      const base = stripTones(t).toLowerCase();
      // tách bằng quay lui, ưu tiên âm tiết dài
      const memo = {};
      const seg = (i) => {
        if (i === base.length) return [];
        if (memo[i] !== undefined) return memo[i];
        for (let len = Math.min(7, base.length - i); len >= 1; len--) {
          let piece = base.slice(i, i + len);
          let digits = '';
          const m = base.slice(i + len).match(/^[0-5]/);
          if (m) digits = m[0];
          if (isSyl(piece)) {
            const rest = seg(i + len + digits.length);
            if (rest) { memo[i] = [[i, i + len + digits.length], ...rest]; return memo[i]; }
          }
        }
        memo[i] = null; return null;
      };
      const r = seg(0);
      if (r) r.forEach(([a, b]) => out.push(t.slice(a, b)));
      else out.push(t);
    });
    return out;
  }
  const isPinyinText = (s) => {
    const toks = String(s).trim().split(/[\s'’·\-]+/).filter(Boolean);
    if (!toks.length) return false;
    return toks.every(tok => {
      const t = stripTones(tok.replace(/[,.;!?]/g, '')).toLowerCase();
      if (!/^[a-zü0-5]+$/.test(t)) return false;
      const parts = splitSyllables(tok);
      return parts.every(p => isSyl(stripTones(p).toLowerCase().replace(/[0-5]/g, '')));
    });
  };

  function segment(text, dictSet) {

        if (j === i) { out.push(c); i++; } else { out.push(s.slice(i, j)); i = j; }
        continue;
      }
      let found = c;
      for (let len = Math.min(6, s.length - i); len >= 2; len--) { const w = s.slice(i, i + len); if (dictSet.has(w)) { found = w; break; } }
      out.push(found); i += found.length;
    }
    return out;
  }

    while (toks.length > 7 && guard++ < 30) {

      for (let k = 0; k < toks.length - 1; k++) { const L = toks[k].length + toks[k + 1].length; if (L < bestLen) { bestLen = L; best = k; } }
      toks.splice(best, 2, toks[best] + toks[best + 1]);
    }
    if (toks.length < 3) { // tách bớt mảnh dài
      const t2 = []; toks.forEach(t => { if (t.length >= 2 && toks.length + t2.length < 4) t2.push(...t.split('')); else t2.push(t); }); toks = t2;
    }

    return toks;

      const t = toks[k];
      if (VI_ONLY.test(t) || !isPinyinText(t)) break;
      py.push(t); syl += Math.max(1, vowelGroups(t)); k++;
    }
    if (syl !== need) return { hanzi: han, pinyin: '', vi: rest.trim() };
    let pinyin = py.join(' ');
    if (hasToneDigits(pinyin)) pinyin = numberedToMarks(pinyin);
    return { hanzi: han, pinyin, vi: toks.slice(k).join(' ') };
  }

  const Core_hanOK = (t) => hanCount(t) >= 2;
  function parse(text) {
    const res = { vocab: [], sentences: [], dialogues: [], mcqs: [], tfs: [], unparsed: [], duplicates: [], warnings: [], lineCount: 0 };
    const raw = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    const lines = raw.map(cleanLine);
    res.lineCount = lines.filter(Boolean).length;
    const isOpt = lines.map(l => OPTION_RE.test(l) && !(HAN.test(l) && DIALOG_RE.test(l) && /^[A-Za-z]\s*[：:]/.test(l)));
    // dòng chứa nhiều phương án liền nhau: "A. 都 B. 很 C. 在 D. 是"
    const inlineOpts = (l) => {
      const m = [...l.matchAll(/(?:^|\s)[\(（]?([A-F])[\)）]?\s*[\.、．)]\s*/g)];
      if (m.length < 2) return null;
      const out = [];
      m.forEach((mm, k) => { const start = mm.index + mm[0].length; const end = k + 1 < m.length ? m[k + 1].index : l.length; out.push(l.slice(start, end).trim()); });
      return out.every(Boolean) ? out : null;
    };
    const used = new Array(lines.length).fill(false);
    const nextNonEmpty = (i) => { let j = i + 1; while (j < lines.length && !lines[j]) j++; return j < lines.length ? j : -1; };
    let curDialog = null;
    const seenVocab = new Map(); const seenSent = new Set();

    const addVocab = (v, lineNo) => {
      if (!v || !v.hanzi) return;
      const key = v.hanzi;
      if (seenVocab.has(key)) {
        const prev = seenVocab.get(key);
        res.duplicates.push({ kind: 'Từ vựng', text: key, line: lineNo + 1 });
        if (!prev.pinyin && v.pinyin) prev.pinyin = v.pinyin; if (!prev.vi && v.vi) prev.vi = v.vi;
        return;
      }
      const item = { ...v, line: lineNo + 1 }; seenVocab.set(key, item); res.vocab.push(item);
    };
    const addSentence = (s, lineNo) => {
      const key = s.zh.replace(/\s/g, '');
      if (seenSent.has(key)) { res.duplicates.push({ kind: 'Câu', text: s.zh, line: lineNo + 1 }); return null; }
      seenSent.add(key); const it = { ...s, line: lineNo + 1 }; res.sentences.push(it); return it;
    };

    for (let i = 0; i < lines.length; i++) {
      if (used[i]) continue;
      const l = lines[i];
      if (!l) { curDialog = null; continue; }
      if (HEADER_RE.test(l)) { used[i] = true; continue; }

      // ---- Câu hỏi trắc nghiệm: tìm phương án trong vài dòng kế tiếp ----
      if (!isOpt[i]) {
        let j = nextNonEmpty(i); const stemIdx = [i]; let steps = 0;
        while (j >= 0 && !isOpt[j] && steps < 2 && !inlineOpts(lines[j])) { stemIdx.push(j); j = nextNonEmpty(j); steps++; }
        const inl = j >= 0 && !isOpt[j] ? inlineOpts(lines[j]) : null;
        const ownInline = inlineOpts(l);
        if (j >= 0 && (isOpt[j] || inl) && !ownInline) {
          // chỉ giữ dòng gần phương án nhất + các dòng hướng dẫn phía trên
          let keep = [stemIdx[stemIdx.length - 1]];
          for (let k = stemIdx.length - 2; k >= 0; k--) { if (INSTR_RE.test(lines[stemIdx[k]]) || /[:：]$/.test(lines[stemIdx[k]])) keep.unshift(stemIdx[k]); else break; }
          if (keep[0] !== i) { /* dòng i không thuộc câu hỏi -> xử lý bình thường ở dưới */ }
          else {
            const q = { stem: keep.map(k => lines[k]).join(' '), options: [], answer: -1, line: i + 1 };
            keep.forEach(k => used[k] = true);
            let k = j;
            if (inl) { q.options = inl; used[k] = true; k = nextNonEmpty(k); }
            else {
              while (k >= 0 && isOpt[k]) {
                const m = lines[k].match(OPTION_RE); let opt = m[2].trim();
                if (CORRECT_MARK.test(opt)) { opt = opt.replace(CORRECT_MARK, '').trim(); q.answer = q.options.length; }
                q.options.push(opt); used[k] = true; k = nextNonEmpty(k);
              }
            }
            if (k >= 0 && ANSWER_RE.test(lines[k])) { const L = lines[k].match(ANSWER_RE)[1].toUpperCase().charCodeAt(0) - 65; if (L < q.options.length) q.answer = L; used[k] = true; }
            q.options = q.options.map(o => o.replace(CORRECT_MARK, '').trim());
            if (q.answer < 0) res.warnings.push(`Dòng ${q.line}: câu trắc nghiệm chưa có đáp án đúng — cần giáo viên chọn.`);
            res.mcqs.push(q); curDialog = null; continue;
          }
        }
        if (ownInline) { // câu hỏi và phương án trên cùng một dòng
          const firstOpt = l.search(/(?:^|\s)[\(（]?A[\)）]?\s*[\.、．)]/);
          const stem = l.slice(0, firstOpt).trim();
          if (stem) {
            const q = { stem, options: ownInline, answer: -1, line: i + 1 }; used[i] = true;
            const k = nextNonEmpty(i);
            if (k >= 0 && ANSWER_RE.test(lines[k])) { const L = lines[k].match(ANSWER_RE)[1].toUpperCase().charCodeAt(0) - 65; if (L < q.options.length) q.answer = L; used[k] = true; }
            if (q.answer < 0) res.warnings.push(`Dòng ${q.line}: câu trắc nghiệm chưa có đáp án đúng — cần giáo viên chọn.`);
            res.mcqs.push(q); continue;
          }
        }
      }
      if (isOpt[i]) { res.unparsed.push({ line: i + 1, text: l, reason: 'Phương án đứng riêng, không tìm thấy câu hỏi' }); continue; }
      if (ANSWER_RE.test(l)) { res.unparsed.push({ line: i + 1, text: l, reason: 'Dòng đáp án không gắn với câu hỏi nào' }); continue; }
      used[i] = true;

      // ---- Đúng/Sai có đánh dấu ----
      const tf = l.match(TF_RE);
      if (tf && HAN.test(tf[1])) {
        const mark = (tf[2] || tf[3]).toLowerCase();
        const val = ['对', '正确', 'đúng', 'true', 't', '√', '✓'].includes(mark);
        res.tfs.push({ zh: tf[1].trim(), value: val, line: i + 1 }); curDialog = null; continue;
      }
      // ---- Hội thoại ----
      const dm = l.match(DIALOG_RE);
      if (dm && HAN.test(dm[2]) && !/[|\t]/.test(l) && hanCount(dm[1]) <= 3 && !INSTR_RE.test(dm[1])) {
        const zh = dm[2].trim();
        if (!curDialog) { curDialog = { lines: [], line: i + 1 }; res.dialogues.push(curDialog); }
        const entry = { speaker: dm[1], zh, vi: '' };
        // dòng dịch tiếng Việt ngay sau (không có chữ Hán)
        const nx = nextNonEmpty(i);
        if (nx >= 0 && nx === i + 1 && !HAN.test(lines[nx]) && !OPTION_RE.test(lines[nx]) && classifyField(lines[nx]) === 'vi') { entry.vi = lines[nx].replace(/^[A-Za-z]\s*[：:]\s*/, ''); used[nx] = true; }
        curDialog.lines.push(entry); continue;
      }
      curDialog = null;

      // ---- Dòng có cột (tab, |, ;, phẩy) ----
      let fields = null;
      if (/\t/.test(l)) fields = l.split('\t');
      else if (/\|/.test(l)) fields = l.split('|');
      else if (/\s[-–—=]\s/.test(l)) fields = l.split(/\s[-–—=]\s/);
      else if (/[,;，；]/.test(l)) {
        const f = l.split(/[,;，；]/);
        const hi = f.findIndex(x => HAN.test(x));
        if (f.length >= 2 && hi >= 0 && hanCount(f[hi]) <= 8 && f.every((x, k) => k === hi || !HAN.test(x)) && f.slice(0, hi).every(x => /^\s*\d{1,5}[\.\)]?\s*$/.test(x))) fields = f;
      }
      if (!fields) {
        const p = l.match(/^([\u3400-\u9fff·]{1,8})\s*[\(（\[]([^)）\]]+)[\)）\]]\s*[:：\-–—=]?\s*(.*)$/);
        if (p) fields = [p[1], p[2], p[3]];
        else { const c = l.match(/^([\u3400-\u9fff·]{1,8})\s*[:：]\s*([^\u3400-\u9fff]+)$/); if (c) fields = [c[1], c[2]]; }
      }
      if (fields && fields.filter(f => f.trim()).length >= 2) {
        const ff = fields.map(f => f.trim());
        const v = fieldsToVocab(ff);
        if (v) {
          addVocab(v, i);
          // cột "Ví dụ": câu tiếng Trung khác chữ chính → thành câu luyện tập (kèm bản dịch nếu cột kế tiếp là tiếng Việt)
          ff.forEach((f, k) => { if (HAN.test(f) && f !== v.hanzi && hanCount(f) >= 3) { const nx = ff[k + 1]; addSentence({ zh: f, vi: nx && !HAN.test(nx) && classifyField(nx) === 'vi' && nx !== v.vi ? nx : '', pinyin: '' }, i); } });
          continue;
        }
        // không phải từ vựng: có thể là câu song ngữ "中文句子 | nghĩa"
        const hanF = fields.find(f => HAN.test(f)); const viF = fields.find(f => !HAN.test(f) && classifyField(f) !== 'py' && f.trim());
        const pyF = fields.find(f => classifyField(f) === 'py');
        if (hanF) { addSentence({ zh: hanF.trim(), vi: viF ? viF.trim() : '', pinyin: pyF ? pyF.trim() : '' }, i); continue; }
      }
      // ---- Cách nhau bằng dấu cách, có câu ví dụ ở cuối: "爸爸 bàba bố 我的爸爸很高" ----
      const ndx = l.match(/^([\u3400-\u9fff]{1,8})\s+([^\u3400-\u9fff]*[A-Za-zÀ-ỹ][^\u3400-\u9fff]*?)\s+([\u3400-\u9fff].*)$/);
      if (ndx && Core_hanOK(ndx[3])) { const v = splitNoDelim(ndx[1], ndx[2]); addVocab(v, i); if (ndx[3].trim() !== ndx[1]) addSentence({ zh: ndx[3].trim(), vi: '', pinyin: '' }, i); continue; }
      // ---- Không phân cách: "你好 nǐ hǎo xin chào" ----
      const nd = l.match(/^([\u3400-\u9fff]{1,8})\s+([^\u3400-\u9fff]+)$/);
      if (nd) { addVocab(splitNoDelim(nd[1], nd[2]), i); continue; }

      // ---- Câu tiếng Trung / chữ Hán đơn ----
      if (HAN.test(l)) {
        const pureHan = l.replace(ZH_PUNCT, ''); ZH_PUNCT.lastIndex = 0;
        if (hanCount(l) <= 4 && /^[\u3400-\u9fff]+$/.test(pureHan) && !/[。！？]/.test(l)) {
          // chỉ có chữ Hán: kiểm tra dòng pinyin / nghĩa phía sau
          const v = { hanzi: pureHan, pinyin: '', vi: '' };
          let nx = nextNonEmpty(i);
          if (nx === i + 1 && !HAN.test(lines[nx]) && !OPTION_RE.test(lines[nx])) { const c = classifyField(lines[nx]); if (c === 'py' || c === 'py?') { v.pinyin = hasToneDigits(lines[nx]) ? numberedToMarks(lines[nx]) : lines[nx]; used[nx] = true; nx = nextNonEmpty(nx); } }
          if (nx >= 0 && !used[nx] && !HAN.test(lines[nx]) && !OPTION_RE.test(lines[nx]) && classifyField(lines[nx]) === 'vi' && nx <= i + 2) { v.vi = lines[nx]; used[nx] = true; }
          addVocab(v, i); continue;
        }
        // tách đoạn văn dài thành các câu
        const parts = l.match(/[^。！？!?]+[。！？!?]?/g) || [l];
        const isPara = parts.length > 1;
        const kept = parts.map(s => s.trim()).filter(s => hanCount(s) >= 2);
        if (!kept.length) { res.unparsed.push({ line: i + 1, text: l, reason: 'Không nhận ra cấu trúc dòng (thiếu pinyin/nghĩa hoặc câu quá ngắn)' }); continue; }
        kept.forEach(s => {
          const sent = { zh: s, vi: '', pinyin: '' };
          if (!isPara) {
            let nx = nextNonEmpty(i);
            if (nx === i + 1 && !HAN.test(lines[nx]) && !OPTION_RE.test(lines[nx])) {
              const c = classifyField(lines[nx]);
              if (c === 'py' || (c === 'py?' && splitSyllables(lines[nx]).length >= hanCount(s) * .6)) { sent.pinyin = lines[nx]; used[nx] = true; nx = nextNonEmpty(nx); }
            }
            if (nx >= 0 && !used[nx] && nx <= i + 2 && !HAN.test(lines[nx]) && !OPTION_RE.test(lines[nx]) && classifyField(lines[nx]) !== 'py') { sent.vi = lines[nx]; used[nx] = true; }
          }
          addSentence(sent, i);
        });
        continue;
      }
      res.unparsed.push({ line: i + 1, text: l, reason: 'Không có chữ Hán hoặc không nhận ra cấu trúc' });
    }
    res.dialogues = res.dialogues.filter(d => d.lines.length >= 1);
    return res;
  }

  /* ---------- BỘ PHÂN LOẠI: chủ đề + HSK dự kiến ---------- */
  function analyze(parsed, rawText, dictLevels) {
    const text = String(rawText || '');
    const allZh = [...parsed.vocab.map(v => v.hanzi), ...parsed.sentences.map(s => s.zh), ...parsed.dialogues.flatMap(d => d.lines.map(x => x.zh)), ...parsed.mcqs.map(q => q.stem + ' ' + q.options.join(' ')), ...parsed.tfs.map(t => t.zh)].join('\n');
    const hanTotal = hanCount(text);
    const viChars = (text.match(/[a-zA-ZÀ-ỹ]/g) || []).length;
    const language = hanTotal === 0 ? 'Không có tiếng Trung' : viChars > hanTotal * 0.6 ? 'Song ngữ Trung - Việt' : 'Tiếng Trung';
    // ---- Cấp độ HSK dự kiến ----
    const levels = [];
    const matched = new Set();
    Object.entries(dictLevels || {}).forEach(([w, lv]) => { if (w.length >= 1 && allZh.includes(w) && !matched.has(w)) { matched.add(w); if (w.length >= 2 || lv >= 1) levels.push(lv); } });
    const gmatch = [];
    GRAMMAR_MARKERS.forEach(([m, lv]) => { if (allZh.includes(m)) { levels.push(lv); gmatch.push(m); } });
    const sentLens = [...parsed.sentences.map(s => hanCount(s.zh)), ...parsed.dialogues.flatMap(d => d.lines.map(x => hanCount(x.zh)))];
    const avgLen = sentLens.length ? sentLens.reduce((a, b) => a + b, 0) / sentLens.length : 0;
    let level, confidence, reason;
    if (levels.length >= 3) {
      const sorted = levels.slice().sort((a, b) => a - b);
      level = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.75))];
      if (avgLen > 22) level = Math.max(level, 5); else if (avgLen > 15) level = Math.max(level, 4);
      confidence = levels.length >= 15 ? 'Khá' : levels.length >= 6 ? 'Trung bình' : 'Thấp';
      reason = `Khớp ${matched.size} từ trong từ điển mẫu, ${gmatch.length} dấu hiệu ngữ pháp${avgLen ? `, độ dài câu TB ${avgLen.toFixed(1)} chữ` : ''}.`;
    } else {
      level = avgLen === 0 ? (hanTotal / Math.max(1, parsed.vocab.length) > 3 ? 3 : 1) : avgLen < 7 ? 1 : avgLen < 10 ? 2 : avgLen < 14 ? 3 : avgLen < 19 ? 4 : avgLen < 25 ? 5 : 6;
      confidence = 'Thấp'; reason = 'Ít từ khớp với từ điển mẫu — ước lượng chủ yếu theo độ dài câu. Giáo viên nên chỉnh lại.';
    }
    level = clamp(level || 1, 1, 6);
    // ---- Chủ đề ----
    const score = {};
    const add = (k, v) => { score[k] = (score[k] || 0) + v; };
    if (parsed.vocab.length) add('Từ vựng', 3 + parsed.vocab.length);
    if (parsed.vocab.some(v => v.pinyin)) add('Pinyin', 2);
    if (parsed.vocab.length) add('Chữ Hán', 1);
    if (parsed.dialogues.length) { add('Hội thoại', 4 + parsed.dialogues.length * 2); add('Giao tiếp hằng ngày', 1); }
    if (parsed.mcqs.length) add('Trắc nghiệm', 4 + parsed.mcqs.length);
    if (parsed.mcqs.some(q => /_{2,}|（\s*）|\(\s*\)/.test(q.stem))) add('Điền từ', 4);
    if (parsed.tfs.length) add('Đúng/Sai', 3 + parsed.tfs.length);
    if (parsed.sentences.length) { add('Đọc hiểu', parsed.sentences.length > 3 ? 3 : 1); add('Trật tự câu', 1); }
    if (parsed.sentences.some(s => s.vi)) { add('Dịch Trung - Việt', 2); add('Dịch Việt - Trung', 1); }
    if (gmatch.some(m => ['把', '被', '虽然', '如果', '不但', '即使', '无论'].includes(m))) add('Ngữ pháp', 4);
    Object.entries(TOPIC_KEYWORDS).forEach(([t, kws]) => { const n = kws.filter(k => text.includes(k)).length; if (n) add(t, n * 2); });
    const topics = Object.entries(score).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ key: k, score: v }));
    // ---- Thống kê ----
    const dialogLines = parsed.dialogues.reduce((a, d) => a + d.lines.length, 0);
    const vocabFull = parsed.vocab.filter(v => v.vi).length;
    const convertible = parsed.mcqs.filter(q => q.answer >= 0).length + parsed.tfs.length + vocabFull + parsed.sentences.filter(s => hanCount(s.zh) >= 4).length + Math.max(0, dialogLines - 1);
    const insufficient = [];
    parsed.vocab.filter(v => !v.vi && !v.pinyin).forEach(v => insufficient.push(`“${v.hanzi}” (dòng ${v.line}): chỉ có chữ Hán, thiếu pinyin và nghĩa.`));
    parsed.vocab.filter(v => v.pinyin && !v.vi).forEach(v => insufficient.push(`“${v.hanzi}” (dòng ${v.line}): thiếu nghĩa tiếng Việt — không tạo được câu hỏi nghĩa.`));
    parsed.mcqs.filter(q => q.answer < 0).forEach(q => insufficient.push(`Câu trắc nghiệm dòng ${q.line}: chưa có đáp án đúng.`));
    parsed.unparsed.forEach(u => insufficient.push(`Dòng ${u.line}: ${u.reason}.`));
    if (vocabFull > 0 && vocabFull < 4) insufficient.push('Ít hơn 4 từ vựng có nghĩa: phương án nhiễu sẽ được bổ sung từ ngân hàng câu hỏi.');
    const totalUnits = parsed.vocab.length + parsed.sentences.length + dialogLines + parsed.mcqs.length + parsed.tfs.length;
    const overallConf = totalUnits === 0 ? 'Không xác định' : parsed.unparsed.length > totalUnits ? 'Thấp' : confidence;
    return {
      language, hsk: level, hskConfidence: confidence, hskReason: reason, topics, primaryTopic: topics[0] ? topics[0].key : 'Từ vựng',
      counts: { vocab: parsed.vocab.length, vocabFull, sentences: parsed.sentences.length, dialogues: parsed.dialogues.length, dialogLines, mcq: parsed.mcqs.length, tf: parsed.tfs.length, convertible, unparsed: parsed.unparsed.length, duplicates: parsed.duplicates.length },
      knowledge: topics.slice(0, 4).map(t => t.key), insufficient, confidence: overallConf, avgLen,
    };
  }

  /* ---------- BỘ SINH CÂU HỎI ---------- */
  /** Tạo câu trắc nghiệm: chọn phương án nhiễu từ danh sách liên quan, xáo trộn và cập nhật chỉ số đáp án */
  function buildMCQ(correct, candidates, n) {
    const c = String(correct).trim();
    const pool = uniq(candidates.map(x => String(x).trim()).filter(x => x && x !== c));
    const distract = pool.slice(0, Math.max(0, n - 1));
    if (distract.length < 1) return null;
    const options = shuffle([c, ...distract]);
    return { options, answer: options.indexOf(c) };
  }
  // Ưu tiên phương án nhiễu cùng cấp HSK, độ dài gần giống
  function rankDistractors(target, pool, key, hsk) {
    const tl = String(target[key] || '').length;
    return shuffle(pool.filter(p => p[key] && p[key] !== target[key]))
      .sort((a, b) => (Math.abs((a.hsk || hsk) - hsk) - Math.abs((b.hsk || hsk) - hsk)) || (Math.abs(String(a[key]).length - tl) - Math.abs(String(b[key]).length - tl)))
      .map(p => p[key]);
  }

  /**
   * Sinh ngân hàng câu hỏi từ dữ liệu đã phân tích.
   * cfg: {hsk, count, types[], topic, difficulty:'easy'|'medium'|'hard'}
   * bankVocab: từ vựng có sẵn (dùng cho phương án nhiễu và tách từ)
   */
  function generate(parsed, cfg, bankVocab = []) {
    const hsk = clamp(+cfg.hsk || 1, 1, 6);
    const nOpt = cfg.difficulty === 'easy' ? 3 : 4;
    const types = new Set(cfg.types && cfg.types.length ? cfg.types : Object.keys(QTYPES));
    const src = 'Tài liệu giáo viên';
    const own = parsed.vocab.map(v => ({ ...v, hsk: v.hsk || hsk }));
    const pool = [...own, ...bankVocab.filter(b => !own.some(o => o.hanzi === b.hanzi))];
    const dict = new Set([...COMMON_WORDS, ...pool.map(v => v.hanzi)]);
    const buckets = {}; const notes = [];
    const push = (t, q) => { (buckets[t] = buckets[t] || []).push(makeQ({ hsk, source: src, difficulty: cfg.difficulty || 'medium', ...q, type: t })); };
    const topicOf = (fallback) => cfg.topic || fallback;

    // 1) Câu hỏi có sẵn trong tài liệu
    parsed.mcqs.forEach(q => {
      const isFill = /_{2,}|（\s*）|\(\s*\)/.test(q.stem);
      const t = isFill ? 'fill' : 'mcq';
      if (!types.has(t) && !types.has('mcq')) return;
      const m = q.stem.match(/[\u3400-\u9fff][^A-Za-zÀ-ỹ]*$/);

    });
    parsed.tfs.forEach(t => { if (types.has('tf')) push('tf', { stem: 'Nhận định sau đúng hay sai?', zh: t.zh, options: ['Đúng', 'Sai'], answer: t.value ? 0 : 1, topic: topicOf('Đúng/Sai'), explanation: `Theo tài liệu: ${t.value ? 'Đúng' : 'Sai'}.` }); });

    // 2) Từ vựng
    own.forEach(v => {
      const withVi = !!v.vi, withPy = !!v.pinyin;
      const ex = `${v.hanzi}${withPy ? ` (${v.pinyin})` : ''}${withVi ? ` = ${v.vi}` : ''}`;
      if (withVi && types.has('meaning')) { const m = buildMCQ(v.vi, rankDistractors(v, pool, 'vi', hsk), nOpt); if (m) push('meaning', { stem: 'Chọn nghĩa tiếng Việt đúng', zh: v.hanzi, pinyin: v.pinyin, vi: v.vi, ...m, topic: topicOf('Từ vựng'), explanation: ex, hide: ['vi'] }); }
      if (withVi && types.has('hanzi')) { const m = buildMCQ(v.hanzi, rankDistractors(v, pool, 'hanzi', hsk), nOpt); if (m) push('hanzi', { stem: `Chọn chữ Hán có nghĩa: “${v.vi}”`, zh: v.hanzi, pinyin: v.pinyin, vi: v.vi, ...m, topic: topicOf('Nhận diện chữ Hán'), explanation: ex, hide: ['zh', 'pinyin'] }); }
      if (withPy && types.has('pinyin')) {
        const tv = toneVariants(v.pinyin, nOpt - 1);
        const cands = cfg.difficulty === 'easy' ? [...rankDistractors(v, pool, 'pinyin', hsk), ...tv] : [...tv, ...rankDistractors(v, pool, 'pinyin', hsk)];
        const m = buildMCQ(v.pinyin, cands, nOpt); if (m) push('pinyin', { stem: 'Chọn pinyin đúng', zh: v.hanzi, pinyin: v.pinyin, vi: v.vi, ...m, topic: topicOf(cfg.difficulty === 'hard' ? 'Thanh điệu' : 'Pinyin'), explanation: ex + ' — chú ý dấu thanh.', hide: ['pinyin'] });
      }
      if (withPy && types.has('py2zh')) { const m = buildMCQ(v.hanzi, rankDistractors(v, pool, 'hanzi', hsk), nOpt); if (m) push('py2zh', { stem: `Pinyin “${v.pinyin}” là chữ Hán nào?`, zh: v.hanzi, pinyin: v.pinyin, vi: v.vi, ...m, topic: topicOf('Pinyin'), explanation: ex, hide: ['zh', 'pinyin'] }); }
      if (types.has('listen')) { const m = buildMCQ(v.hanzi, rankDistractors(v, pool, 'hanzi', hsk), nOpt); if (m) push('listen', { stem: '🔊 Nghe và chọn chữ Hán đúng', zh: v.hanzi, pinyin: v.pinyin, vi: v.vi, ...m, topic: topicOf('Nghe hiểu'), explanation: ex, hide: ['zh', 'pinyin', 'vi'] }); }
      if (withVi && withPy && types.has('guess')) { const m = buildMCQ(v.hanzi, rankDistractors(v, pool, 'hanzi', hsk), nOpt); if (m) push('guess', { stem: `Gợi ý: ${hanCount(v.hanzi)} chữ, pinyin bắt đầu bằng “${stripTones(v.pinyin)[0]}…”, nghĩa liên quan tới “${v.vi}”. Đó là chữ nào?`, zh: v.hanzi, pinyin: v.pinyin, vi: v.vi, ...m, topic: topicOf('Chữ Hán'), explanation: ex, hide: ['zh', 'pinyin', 'vi'] }); }
      if (withVi && types.has('tf')) {
        const truth = Math.random() < .5; const other = rankDistractors(v, pool, 'vi', hsk)[0];
        if (truth || other) push('tf', { stem: 'Nhận định sau đúng hay sai?', zh: `「${v.hanzi}」的意思是“${truth ? v.vi : other}”。`, pinyin: v.pinyin, options: ['Đúng', 'Sai'], answer: truth ? 0 : 1, topic: topicOf('Đúng/Sai'), explanation: ex, flag: truth ? null : 'auto' });

      const ok = own.filter(v => v.vi && v.pinyin);

    }

    // 3) Câu
    const sentences = parsed.sentences;
    sentences.forEach(s => {
      const zh = s.zh;
      if (types.has('fill')) {
        const words = pool.map(v => v.hanzi).filter(w => w.length >= 1 && zh.includes(w)).sort((a, b) => b.length - a.length);

      if (types.has('tf')) { const truth = Math.random() < .5; const other = shuffle(bil.filter(x => x !== s))[0]; push('tf', { stem: 'Bản dịch sau đúng hay sai?', zh: `${s.zh} → “${truth ? s.vi : other.vi}”`, options: ['Đúng', 'Sai'], answer: truth ? 0 : 1, topic: topicOf('Dịch Trung - Việt'), explanation: `${s.zh} = ${s.vi}`, flag: 'inferred' }); }

    // 4) Hội thoại
    const allReplies = parsed.dialogues.flatMap(d => d.lines.map(l => l.zh));
    parsed.dialogues.forEach(d => {

    // 5) Chọn câu: (a) mỗi từ vựng ít nhất một câu, (b) chia đều phần còn lại cho các dạng, loại trùng
    const total = cfg.count || 20;

  /* ---------- CHUYỂN ĐỔI CÂU HỎI CHO TRÒ CHƠI ---------- */
  const MCQ_TYPES = ['meaning', 'hanzi', 'pinyin', 'py2zh', 'listen', 'fill', 'tf', 'grammar', 'guess', 'dialog', 'situation', 'zh2vi', 'vi2zh', 'mcq'];

  }

    const col = (r, k) => { const i = head.indexOf(k); return i >= 0 ? (r[i] || '').trim() : ''; };
    return rows.slice(1).map(r => {
      const ans = col(r, 'answer');
      return makeQ({ id: col(r, 'id') || undefined, hsk: +col(r, 'hsk') || 1, topic: col(r, 'topic'), type: col(r, 'type') || 'mcq', stem: col(r, 'stem'), zh: col(r, 'zh'), pinyin: col(r, 'pinyin'), vi: col(r, 'vi'), options: col(r, 'options') ? col(r, 'options').split('||').map(x => x.trim()) : [], answer: /^[A-F]$/i.test(ans) ? ans.toUpperCase().charCodeAt(0) - 65 : (ans === '' ? -1 : +ans), tokens: col(r, 'tokens') ? col(r, 'tokens').split('||').map(x => x.trim()) : [], explanation: col(r, 'explanation'), source: col(r, 'source') || 'Nhập CSV', difficulty: col(r, 'difficulty') || 'medium', reviewed: col(r, 'reviewed') === '1', tags: col(r, 'tags') ? col(r, 'tags').split(';') : [] });

  // Bộ đề mẫu cho từng cấp: 5 câu biên soạn + câu sinh từ từ vựng mẫu

    gen.questions.forEach(q => { q.source = 'Mẫu HSK (tự sinh từ từ vựng mẫu)'; q.reviewed = !q.flag; q.createdAt = 2; });
    S.questions.push(...gen.questions);
    const ids = [...seed.questions.filter(q => q.hsk === lv).map(q => q.id), ...gen.questions.map(q => q.id)];

  },
  play(name) {
    if (!this.ensure() || S.settings.muted) return;
    const T = (...a) => this.tone(...a);
    switch (name) {
      case 'select': T(660, .08, 'triangle', .2); break;
      case 'correct': T(660, .12, 'triangle', .3); T(990, .2, 'triangle', .3, .1); break;
      case 'wrong': T(220, .25, 'sawtooth', .18, 0, -80); break;

      case 'complete': T(784, .1, 'sine', .25); T(1175, .18, 'sine', .25, .08); break;

const Fx = {
  parts: [], running: false, cv: null,
  confetti(n = 80) {
    if (!S.settings.effects || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    for (let i = 0; i < n; i++) this.parts.push({ x: W / 2 + (Math.random() - .5) * W * .5, y: H * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 6 + 3, c: cols[i % 5], a: Math.random() * 6, life: 1 });

  },
  step() {
    const ctx = this.cv.getContext('2d'); ctx.clearRect(0, 0, this.cv.width, this.cv.height);
    this.parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .25; p.a += .2; p.life -= .008; ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    this.parts = this.parts.filter(p => p.life > 0 && p.y < this.cv.height + 20);
    if (this.parts.length) requestAnimationFrame(() => this.step()); else { this.running = false; ctx.clearRect(0, 0, this.cv.width, this.cv.height); }
  },
};

/* ---------- AI NÂNG CAO (tùy chọn, cần API key) ---------- */
const AI = {
  providers: {
    none: { label: 'Không dùng (bộ phân tích JavaScript)' },
    anthropic: { label: 'Anthropic Claude', endpoint: 'https://api.anthropic.com/v1/messages', model: 'claude-sonnet-5-5' },
    openai: { label: 'OpenAI hoặc API tương thích OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
  },
  configured() { const a = S.settings.ai; return a.provider !== 'none' && !!a.key; },
  prompt(text, cfg) {
    return `Bạn là giáo viên tiếng Trung. Từ TÀI LIỆU dưới đây, hãy tạo tối đa ${cfg.count} câu hỏi cho học viên người Việt, cấp HSK ${cfg.hsk}, mức độ ${cfg.difficulty}.
Chỉ dùng thông tin có trong tài liệu, không bịa nghĩa hay pinyin. Các dạng được phép: ${(cfg.types || []).join(', ')}.
Trả về DUY NHẤT một mảng JSON (không markdown), mỗi phần tử có dạng:
{"type":"meaning|hanzi|pinyin|py2zh|listen|fill|order|tf|grammar|guess|dialog|situation|zh2vi|vi2zh|mcq","hsk":1-6,"topic":"...","stem":"lời dẫn tiếng Việt","zh":"nội dung tiếng Trung","pinyin":"...","vi":"nghĩa tiếng Việt","options":["..."],"answer":0,"tokens":["chỉ dùng cho type order, theo thứ tự đúng"],"explanation":"giải thích ngắn bằng tiếng Việt"}
Với type tf: options là ["Đúng","Sai"], answer 0 = Đúng. Với type order: options để trống, tokens theo đúng thứ tự.
TÀI LIỆU:
${text.slice(0, 12000)}`;
  },
  async call(prompt) {
    const a = S.settings.ai; const P = this.providers[a.provider];
    const endpoint = a.endpoint || P.endpoint; const model = a.model || P.model;
    let res;
    if (a.provider === 'anthropic') {
      res = await fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': a.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model, max_tokens: 4000, messages: [{ role: 'user', content: prompt }] }) });
    } else {
      res = await fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + a.key }, body: JSON.stringify({ model, temperature: 0.3, messages: [{ role: 'system', content: 'Bạn chỉ trả lời bằng JSON hợp lệ.' }, { role: 'user', content: prompt }] }) });
    }
    if (!res.ok) { let msg = res.status + ' ' + res.statusText; try { const j = await res.json(); msg += ' — ' + (j.error && (j.error.message || j.error.type) || JSON.stringify(j).slice(0, 200)); } catch (e) { /* bỏ qua */ } throw new Error(msg); }
    const data = await res.json();
    const txt = a.provider === 'anthropic' ? (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n') : (data.choices && data.choices[0] && data.choices[0].message.content) || '';
    return { txt, model };
  },
  async generate(text, cfg) {
    const { txt, model } = await this.call(this.prompt(text, cfg));
    const clean = txt.replace(/```json|```/g, '').trim(); const start = clean.indexOf('['); const end = clean.lastIndexOf(']');
    if (start < 0 || end < 0) throw new Error('Phản hồi AI không chứa mảng JSON.');
    let arr; try { arr = JSON.parse(clean.slice(start, end + 1)); } catch (e) { throw new Error('Không đọc được JSON từ AI: ' + e.message); }
    const out = []; let dropped = 0;
    arr.forEach(o => {
      if (!o || !Core.QTYPES[o.type]) { dropped++; return; }
      const q = Core.makeQ({ ...o, hsk: o.hsk || cfg.hsk, source: `AI (${S.settings.ai.provider} / ${model})`, flag: 'ai', reviewed: false, hide: o.type === 'meaning' ? ['vi'] : ['hanzi', 'py2zh', 'listen', 'guess'].includes(o.type) ? ['zh', 'pinyin'] : o.type === 'pinyin' ? ['pinyin'] : [] });
      if (Core.validateQ(q).length) { dropped++; return; } out.push(q);
    });
    if (!out.length) throw new Error('AI không trả về câu hỏi hợp lệ nào.');
    return { questions: out, dropped };
  },
};

function saveGenAsSet() {
  if (!Gen.questions.length) return;
  const missing = Gen.questions.filter(q => q.flag === 'missing-answer').length;
  const unrev = Gen.questions.filter(q => !q.reviewed).length;
  const c = Gen.cfg;
  Modal.open({
    title: 'Lưu thành bộ đề', body: `
    <div class="field"><label class="f">Tên bộ đề</label><input type="text" id="sName" value="${esc(`HSK ${c.hsk} – ${(Gen.analysis && Gen.analysis.primaryTopic) || 'Bộ đề'} – ${new Date().toLocaleDateString('vi-VN')}`)}"></div>
    ${missing ? `<div class="notice bad small">${missing} câu chưa có đáp án đúng sẽ được lưu nhưng không được dùng trong trò chơi cho đến khi bạn chọn đáp án.</div>` : ''}
    ${unrev ? `<div class="notice warn small" style="margin-top:8px">${unrev} câu chưa được duyệt. Bạn vẫn có thể lưu và duyệt sau trong Ngân hàng câu hỏi.</div>` : ''}`,
    buttons: [{ label: 'Hủy' }, {
      label: 'Lưu bộ đề', cls: 'primary', act: async (b) => {
        const name = $('#sName', b).value.trim() || 'Bộ đề mới';
        const qs = Gen.questions.map(q => ({ ...q, id: q.id || uid('q') }));
        const existing = new Set(S.questions.map(q => q.id));
        qs.forEach(q => { if (existing.has(q.id)) q.id = uid('q'); });
        S.questions.push(...qs);
        // lưu từ vựng mới để làm phương án nhiễu cho các lần sau
        if (Gen.parsed) Gen.parsed.vocab.filter(v => v.vi && !S.vocab.some(x => x.hanzi === v.hanzi)).forEach(v => S.vocab.push({ id: uid('v'), hanzi: v.hanzi, pinyin: v.pinyin, vi: v.vi, emoji: '', hsk: c.hsk, source: 'Tài liệu giáo viên' }));
        const set = { id: uid('set'), name, hsk: c.hsk, topic: c.topic || (Gen.analysis && Gen.analysis.primaryTopic) || '', questionIds: qs.map(q => q.id), config: { timePerQ: c.timePerQ, retries: c.retries, showPinyin: c.showPinyin, showVi: c.showVi, readAloud: c.readAloud, explain: c.explain, count: c.count, mode: c.mode, autoNext: true }, createdAt: Date.now(), lastUsed: 0 };
        S.sets.push(set);
        const ok = (await Store.saveNow('questions')) && (await Store.saveNow('sets')); Store.save('vocab');
        if (ok) { toast(`Đã lưu bộ đề “${name}” (${qs.length} câu).`, 'ok'); Gen.questions = []; Gen.notes = []; Modal.open({ title: 'Đã lưu bộ đề', body: `<p>Bộ đề <b>${esc(name)}</b> đã sẵn sàng. Bạn muốn làm gì tiếp?</p>`, buttons: [{ label: 'Ở lại trang này', act: () => Pages.generator() }, { label: '🎮 Chọn trò chơi', cls: 'primary', act: () => go('library', { setId: set.id }) }] }); }
      },
    }],
  });

      ${q.type === 'order' ? `<div class="answer-btns">${shuffle(q.tokens).map(t => `<span class="btn">${esc(t)}</span>`).join('')}</div>` : q.type === 'match' ? `<div class="opts" style="justify-content:center">${q.pairs.map(p => `<span>${esc(p.zh)}</span>`).join('')}</div>` : `<div class="answer-btns">${q.options.map((o, k) => `<button class="btn" data-k="${k}">${String.fromCharCode(65 + k)}. ${esc(o)}</button>`).join('')}</div>`}

    $$('[data-k]', b).forEach(btn => btn.onclick = () => { const k = +btn.dataset.k; const ok = k === q.answer; SFX.play(ok ? 'correct' : 'wrong'); $('#pvFb', b).innerHTML = `<div class="notice ${ok ? 'ok' : 'bad'}">${ok ? '✓ Chính xác' : '✗ Chưa đúng — đáp án: ' + esc(q.options[q.answer] || '(chưa có)')}${q.explanation ? '<br><span class="small">' + esc(q.explanation) + '</span>' : ''}</div>`; });

function editQuestion(orig, onSave) {
  const q = structuredClone(orig);
  const body = () => `
    <div class="grid g4">
      <div class="field"><label class="f">Dạng câu hỏi</label><select id="eType">${typeOptions(q.type)}</select></div>
      <div class="field"><label class="f">Cấp độ</label><select id="eHsk">${hskOptions(q.hsk)}</select></div>
      <div class="field"><label class="f">Chủ đề</label><select id="eTopic">${topicOptions(q.topic)}</select></div>
      <div class="field"><label class="f">Mức độ</label><select id="eDiff"><option value="easy">Dễ</option><option value="medium">Trung bình</option><option value="hard">Khó</option></select></div>
    </div>
    <div class="field"><label class="f">Lời dẫn / câu hỏi</label><input type="text" id="eStem" value="${esc(q.stem)}"></div>
    <div class="grid g3">
      <div class="field"><label class="f">Nội dung tiếng Trung</label><input type="text" id="eZh" class="zh" value="${esc(q.zh)}"></div>
      <div class="field"><label class="f">Pinyin</label><input type="text" id="ePy" value="${esc(q.pinyin)}"></div>
      <div class="field"><label class="f">Nghĩa tiếng Việt</label><input type="text" id="eVi" value="${esc(q.vi)}"></div>
    </div>
    <div id="eOptsWrap"></div>
    <div class="field"><label class="f">Giải thích</label><textarea id="eExp" rows="2">${esc(q.explanation)}</textarea></div>
    <div class="grid g2"><div class="field"><label class="f">Thẻ (ngăn cách bằng dấu phẩy)</label><input type="text" id="eTags" value="${esc(q.tags.join(', '))}"></div>
    <div class="field"><label class="f">Ẩn khi chơi (tránh lộ đáp án)</label><div>${['zh', 'pinyin', 'vi'].map(k => `<label class="chk"><input type="checkbox" class="eHide" value="${k}" ${q.hide.includes(k) ? 'checked' : ''}>${{ zh: 'Chữ Hán', pinyin: 'Pinyin', vi: 'Nghĩa' }[k]}</label>`).join('')}</div></div></div>
    <label class="chk"><input type="checkbox" id="eRev" ${q.reviewed ? 'checked' : ''}> Giáo viên đã kiểm duyệt</label>
    <div id="eErr" style="margin-top:8px"></div>`;
  const optsHTML = () => {
    if (q.type === 'order') return `<div class="field"><label class="f">Các mảnh câu theo thứ tự ĐÚNG (ngăn cách bằng “|”)</label><input type="text" id="eTokens" class="zh" value="${esc(q.tokens.join(' | '))}"><div class="tiny muted">Khi chơi, hệ thống tự xáo trộn các mảnh.</div></div>`;
    if (q.type === 'match') return `<div class="field"><label class="f">Các cặp, mỗi dòng: chữ Hán | pinyin | nghĩa</label><textarea id="ePairs" rows="4" class="zh">${esc(q.pairs.map(p => `${p.zh} | ${p.py} | ${p.vi}`).join('\n'))}</textarea></div>`;
    if (q.type === 'tf' && q.options.length !== 2) { q.options = ['Đúng', 'Sai']; if (q.answer > 1) q.answer = 0; }
    return `<label class="f">Đáp án (chọn nút tròn ở đáp án đúng)</label><div id="eOpts">${q.options.map((o, i) => `<div class="row" style="margin-bottom:6px"><input type="radio" name="eAns" value="${i}" ${i === q.answer ? 'checked' : ''} aria-label="Đáp án đúng"><b>${String.fromCharCode(65 + i)}</b><input type="text" class="eOpt zh" value="${esc(o)}" style="flex:1"><button class="iconbtn" data-rm="${i}" title="Xóa đáp án">✕</button></div>`).join('')}</div>${q.options.length < 6 && q.type !== 'tf' ? '<button class="btn sm" id="eAddOpt">+ Thêm đáp án</button>' : ''}`;
  };
  const collectOpts = (b) => {
    if ($('#eTokens', b)) q.tokens = $('#eTokens', b).value.split('|').map(s => s.trim()).filter(Boolean);
    if ($('#ePairs', b)) q.pairs = $('#ePairs', b).value.split('\n').map(l => l.split('|').map(s => s.trim())).filter(p => p[0]).map(p => ({ zh: p[0], py: p[1] || '', vi: p[2] || '' }));
    if ($('#eOpts', b)) { q.options = $$('.eOpt', b).map(x => x.value.trim()); const r = $('input[name=eAns]:checked', b); q.answer = r ? +r.value : -1; }
  };
  const drawOpts = (b) => {
    $('#eOptsWrap', b).innerHTML = optsHTML();
    $$('[data-rm]', b).forEach(btn => btn.onclick = (e) => { e.preventDefault(); collectOpts(b); const i = +btn.dataset.rm; q.options.splice(i, 1); if (q.answer === i) q.answer = -1; else if (q.answer > i) q.answer--; drawOpts(b); });
    if ($('#eAddOpt', b)) $('#eAddOpt', b).onclick = (e) => { e.preventDefault(); collectOpts(b); q.options.push(''); drawOpts(b); };
  };
  Modal.open({
    title: orig.stem || orig.zh ? 'Sửa câu hỏi' : 'Thêm câu hỏi', wide: true, body: body(),
    onOpen: (b) => { $('#eDiff', b).value = q.difficulty; drawOpts(b); $('#eType', b).onchange = () => { collectOpts(b); q.type = $('#eType', b).value; drawOpts(b); }; },
    buttons: [{ label: 'Hủy' }, {
      label: 'Lưu câu hỏi', cls: 'primary', act: (b) => {
        collectOpts(b);
        Object.assign(q, { type: $('#eType', b).value, hsk: +$('#eHsk', b).value, topic: $('#eTopic', b).value, difficulty: $('#eDiff', b).value, stem: $('#eStem', b).value.trim(), zh: $('#eZh', b).value.trim(), pinyin: $('#ePy', b).value.trim(), vi: $('#eVi', b).value.trim(), explanation: $('#eExp', b).value.trim(), tags: $('#eTags', b).value.split(',').map(s => s.trim()).filter(Boolean), reviewed: $('#eRev', b).checked, hide: $$('.eHide:checked', b).map(x => x.value) });
        const errs = Core.validateQ(q);
        if (errs.length) { $('#eErr', b).innerHTML = `<div class="notice bad small">${errs.map(esc).join('<br>')}</div>`; return false; }
        if (q.flag === 'missing-answer') q.flag = null;
        onSave(q); toast('Đã lưu câu hỏi.', 'ok');
      },
    }],
  });
}

const Bank = { tab: 'questions', q: '', hsk: '', topic: '', type: '', status: '', tag: '', page: 0, sel: new Set() };
function bankFiltered() {
  const s = Bank.q.trim().toLowerCase(); const sNo = Core.stripTones(s);
  return S.questions.filter(q => {
    if (Bank.hsk && q.hsk !== +Bank.hsk) return false;
    if (Bank.topic && q.topic !== Bank.topic) return false;
    if (Bank.type && q.type !== Bank.type) return false;
    if (Bank.tag && !q.tags.includes(Bank.tag)) return false;
    if (Bank.status === 'unreviewed' && q.reviewed) return false;
    if (Bank.status === 'check' && !['inferred', 'ai'].includes(q.flag)) return false;
    if (Bank.status === 'missing' && q.flag !== 'missing-answer') return false;
    if (Bank.status === 'fav' && !q.fav) return false;
    if (s) { const hay = [q.stem, q.zh, q.pinyin, q.vi, ...q.options, ...q.tokens, q.explanation].join(' ').toLowerCase(); if (!hay.includes(s) && !Core.stripTones(hay).includes(sNo)) return false; }
    return true;
  });
}

const MP_VER = '0.10.14'; // @mediapipe/tasks-vision — wasm và bundle cùng phiên bản

/** Quản lý một luồng webcam duy nhất cho toàn ứng dụng */
const Cam = {
  stream: null, video: null, status: 'off', error: '', devices: [], deviceId: null,
  init() { this.video = $('#camVideo'); },
  async start() {
    if (this.stream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.fail(window.isSecureContext === false ? 'Trang đang mở qua kết nối không bảo mật nên trình duyệt chặn camera. Hãy mở qua https:// hoặc http://localhost.' : 'Trình duyệt này không hỗ trợ camera. Hãy dùng Chrome, Edge hoặc Firefox bản mới.');
      return false;
    }
    this.set('requesting', '');
    try {
      const v = { width: { ideal: 960 }, height: { ideal: 540 } };
      if (this.deviceId) v.deviceId = { exact: this.deviceId }; else v.facingMode = 'user';
      this.stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
      this.video.srcObject = this.stream; await this.video.play();
      this.video.classList.add('on'); this.set('on', '');
      try { this.devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); } catch (e) { this.devices = []; }
      return true;
    } catch (e) {
      const map = {
        NotAllowedError: 'Quyền camera bị từ chối. Bấm biểu tượng ổ khóa/camera trên thanh địa chỉ → chọn “Cho phép” → bấm “Thử lại”.',
        SecurityError: 'Trình duyệt chặn camera vì lý do bảo mật. Mở trang qua https:// hoặc http://localhost.',
        NotFoundError: 'Không tìm thấy camera. Kiểm tra webcam đã cắm và được bật.',
        OverconstrainedError: 'Camera không hỗ trợ cấu hình yêu cầu. Bấm “Đổi camera” hoặc thử lại.',
        NotReadableError: 'Camera đang bị ứng dụng khác sử dụng (Zoom, Teams, Meet…). Đóng ứng dụng đó rồi bấm “Thử lại”.',
        AbortError: 'Việc mở camera bị gián đoạn. Bấm “Thử lại”.',
      };
      this.stop(true); this.fail(map[e.name] || ('Không mở được camera: ' + (e.message || e.name)));
      return false;
    }
  },
  stop(keepError) { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; if (this.video) { this.video.srcObject = null; this.video.classList.remove('on'); } if (!keepError) this.set('off', ''); },
  async switchCam() {
    if (this.devices.length < 2) { toast('Thiết bị chỉ có một camera.', 'warn'); return; }
    const cur = this.stream && this.stream.getVideoTracks()[0] && this.stream.getVideoTracks()[0].getSettings().deviceId;
    const idx = this.devices.findIndex(d => d.deviceId === cur); this.deviceId = this.devices[(idx + 1) % this.devices.length].deviceId;
    this.stop(); await this.start();
  },
  fail(msg) { this.set('error', msg); },
  set(st, err) { this.status = st; this.error = err; Room.refreshCamUI(); },
  ready() { return !!this.stream && this.video.readyState >= 2 && this.video.videoWidth > 0; },
};

/** Tải MediaPipe theo nhu cầu, chỉ những mô hình trò chơi đang cần */
const Vision = {
  lib: null, fileset: null, lm: {}, loading: {}, state: { hand: 'idle', face: 'idle', pose: 'idle' }, err: {},
  async ensureLib() {
    if (this.lib) return;
    this.lib = await import(`${MP_BASE}/vision_bundle.mjs`);
    this.fileset = await this.lib.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  },
  async load(kind) {
    if (this.lm[kind]) return this.lm[kind];
    if (this.loading[kind]) return this.loading[kind];
    this.state[kind] = 'loading'; Room.refreshCamUI();
    this.loading[kind] = (async () => {
      await this.ensureLib();
      const { HandLandmarker, FaceLandmarker, PoseLandmarker } = this.lib;
      const Cls = kind === 'hand' ? HandLandmarker : kind === 'face' ? FaceLandmarker : PoseLandmarker;
      const extra = kind === 'hand' ? { numHands: 2, minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5 } : kind === 'face' ? { numFaces: 1, outputFaceBlendshapes: true } : { numPoses: 1 };
      const opts = (delegate) => ({ baseOptions: { modelAssetPath: MP_MODELS[kind], delegate }, runningMode: 'VIDEO', ...extra });
      try { return await Cls.createFromOptions(this.fileset, opts('GPU')); } catch (e) { console.warn('GPU không khả dụng, dùng CPU', e); return await Cls.createFromOptions(this.fileset, opts('CPU')); }

  detect(kind, video, ts) { const m = this.lm[kind]; if (!m) return null; try { return m.detectForVideo(video, ts); } catch (e) { console.warn('detect lỗi', e); return null; } },
};

const HAND_LINKS = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];

/**
 * Tracker: chạy suy luận theo tần suất giới hạn, đổi tọa độ về khung sân khấu

  smooth(key, p) { const a = 1 - clamp(S.settings.smoothing, 0, .9); const o = this.ema[key]; const n = o ? { x: o.x + (p.x - o.x) * a, y: o.y + (p.y - o.y) * a } : { ...p }; this.ema[key] = n; return n; },

      if (r) {
        const lm = r.faceLandmarks && r.faceLandmarks[0];
        if (lm) {
          const px = lm.map(p => this.map(p, W, H));
          const L = px[33].x < px[263].x ? px[33] : px[263], R = L === px[33] ? px[263] : px[33];
          const roll = Math.atan2(R.y - L.y, R.x - L.x) * 180 / Math.PI;
          const bs = r.faceBlendshapes && r.faceBlendshapes[0] ? Object.fromEntries(r.faceBlendshapes[0].categories.map(c => [c.categoryName, c.score])) : null;
          const faceH = dist(px[10], px[152]) || 1;
          const mouthGeo = clamp(dist(px[13], px[14]) / faceH / .18, 0, 1);
          const smileGeo = clamp((dist(px[61], px[291]) / dist(px[234], px[454]) - .36) / .14, 0, 1);
          const prevRoll = this.st.face && this.st.face.present ? this.st.face.roll : roll;
          this.st.face = { present: true, px, roll: prevRoll + (roll - prevRoll) * (1 - clamp(S.settings.smoothing, 0, .9)), smile: bs ? ((bs.mouthSmileLeft || 0) + (bs.mouthSmileRight || 0)) / 2 : smileGeo, mouth: bs ? clamp((bs.jawOpen || 0) / .6, 0, 1) : mouthGeo, blend: !!bs };
        } else this.st.face = { present: false };
        changed = true;
      }
    }
    if (this.kinds.includes('pose') && Vision.lm.pose) {
      const r = Vision.detect('pose', Cam.video, ts);

        const lm = r.landmarks && r.landmarks[0];

  draw(ctx, W, H) {
    ctx.clearRect(0, 0, W, H);

    st.hands.forEach(h => {
      ctx.strokeStyle = 'rgba(15,179,163,.85)'; ctx.beginPath(); HAND_LINKS.forEach(([a, b]) => { ctx.moveTo(h.px[a].x, h.px[a].y); ctx.lineTo(h.px[b].x, h.px[b].y); }); ctx.stroke();

      ctx.fillStyle = '#fff'; [0, 11, 12, 13, 14, 15, 16, 23, 24].forEach(k => { const p = st.pose.px[k]; if (p.v > .4) { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill(); } });
    }
  },
};

/** Dwell time dùng chung: giữ trong vùng đủ thời gian mới xác nhận */
class Dwell {
  constructor(ms) { this.ms = ms || S.settings.dwellMs; this.zone = null; this.t = 0; this.cool = 0; }
  reset() { this.zone = null; this.t = 0; }
  update(zone, dt) {
    const step = dt * 1000;
    if (this.cool > 0) { this.cool -= step; return { zone: null, p: 0, done: false }; }
    if (zone == null) {
      if (S.settings.dwellDecay && this.zone != null) { this.t = Math.max(0, this.t - step * 2); if (!this.t) this.zone = null; } else { this.t = 0; this.zone = null; }
      return { zone: this.zone, p: this.t / this.ms, done: false, leaving: true };
    }
    if (zone !== this.zone) { this.zone = zone; this.t = 0; }
    this.t += step;
    if (this.t >= this.ms) { const z = this.zone; this.t = 0; this.zone = null; this.cool = 700; return { zone: z, p: 1, done: true }; }
    return { zone, p: this.t / this.ms, done: false };
  }
}

/* ---------- Vẽ trên canvas ---------- */
const ZH_FONT = `'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif`;

    let size = maxSize, lines;

    return size;
  },
  zone(ctx, z, label, text, prog = 0, state = '', hover = false) {
    ctx.save();
    const fill = state === 'ok' ? 'rgba(220,247,232,.96)' : state === 'bad' ? 'rgba(253,230,230,.96)' : hover ? 'rgba(255,255,255,.98)' : 'rgba(255,255,255,.88)';
    ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 14; this.rr(ctx, z.x, z.y, z.w, z.h, 18); ctx.fillStyle = fill; ctx.fill(); ctx.shadowBlur = 0;
    ctx.lineWidth = hover || state ? 4 : 2; ctx.strokeStyle = state === 'ok' ? '#14a058' : state === 'bad' ? '#e1484d' : hover ? '#0fb3a3' : 'rgba(18,53,64,.15)'; ctx.stroke();
    if (label) { ctx.fillStyle = '#0fb3a3'; ctx.beginPath(); ctx.arc(z.x + 24, z.y + 24, 15, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `800 15px Inter,system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, z.x + 24, z.y + 25); }
    this.fit(ctx, text, z.x + z.w / 2 + (label ? 10 : 0), z.y + z.h / 2 + (label ? 8 : 0), z.w - (label ? 64 : 28), z.h - (label ? 40 : 20), Math.min(40, z.h * .36));
    if (prog > 0) { ctx.fillStyle = 'rgba(15,179,163,.22)'; this.rr(ctx, z.x + 10, z.y + z.h - 14, z.w - 20, 7, 4); ctx.fill(); ctx.fillStyle = '#0fb3a3'; this.rr(ctx, z.x + 10, z.y + z.h - 14, (z.w - 20) * clamp(prog, 0, 1), 7, 4); ctx.fill(); }
    ctx.restore();
  },
  cursor(ctx, p, prog = 0, color = '#0fb3a3', pinch = false) {
    if (!p) return; ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, pinch ? 9 : 13, 0, 7); ctx.fillStyle = pinch ? color : 'rgba(255,255,255,.85)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = color; ctx.stroke();
    if (prog > 0) { ctx.beginPath(); ctx.arc(p.x, p.y, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(prog, 0, 1)); ctx.lineWidth = 5; ctx.strokeStyle = color; ctx.stroke(); }
    ctx.restore();
  },
  label(ctx, text, x, y, size = 16, bg = 'rgba(255,255,255,.92)', color = '#123540') {
    ctx.save(); ctx.font = `700 ${size}px Inter,${ZH_FONT}`; const w = ctx.measureText(text).width + 20; this.rr(ctx, x - w / 2, y - size * .9, w, size * 1.8, 10); ctx.fillStyle = bg; ctx.fill(); ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1); ctx.restore();
  },
};
const inRect = (p, r) => p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const zoneAt = (p, zones) => { if (!p) return null; const i = zones.findIndex(z => inRect(p, z)); return i < 0 ? null : i; };

  const all = [{ x: 14, y: yT, w, h }, { x: W - w - 14, y: yT, w, h }, { x: 14, y: yB, w, h }, { x: W - w - 14, y: yB, w, h }];
  if (n === 2) return [{ x: 14, y: (top + H) / 2 - h / 2, w, h }, { x: W - w - 14, y: (top + H) / 2 - h / 2, w, h }];

const LETTERS = 'ABCDEF';

/* =====================================================================
   PHIÊN CHƠI — điều phối câu hỏi, đồng hồ, chấm điểm, ghi kết quả
   ===================================================================== */
class Session {
  constructor(def, cfg, items) {
    this.def = def; this.cfg = cfg; this.items = items;
    this.idx = -1; this.current = null; this.records = []; this.state = 'ready'; this.paused = false; this.locked = false;
    this.turn = 0; this.attempts = 0; this.timeLeft = 0; this.startedAt = 0; this.qStart = 0; this.lastChoice = null; this.revealed = false;
    this.players = cfg.players.map(p => ({ ...p, score: 0, correct: 0, total: 0, combo: 0 }));
    this.overridePlayer = null; this.fbTimer = null;
    this.game = def.create(this);
  }
  get player() { return this.overridePlayer || this.players[this.turn % this.players.length]; }
  get score() { return this.players.reduce((a, p) => a + p.score, 0); }
  start() {
    this.state = 'playing'; this.startedAt = performance.now();
    if (this.game.start) this.game.start();
    if (!this.def.manual) this.next();
    Room.hud();
  }
  /** Lấy câu kế tiếp (trò tự điều phối gọi hàm này) */
  request() {
    this.idx++;
    if (this.idx >= this.items.length) { this.finish(); return null; }
    this.current = this.items[this.idx]; this.attempts = 0; this.locked = false; this.revealed = false; this.lastChoice = null;
    this.qStart = performance.now(); this.timeLeft = this.cfg.timePerQ;
    Room.banner(this.current, this); Room.hud();
    if (this.cfg.readAloud) { const t = this.current.speak || (this.current.zh && !(this.current.hide || []).includes('zh') ? this.current.zh : ''); if (t) setTimeout(() => TTS.speak(t), 250); }
    if (this.current.kind === 'mcq' && this.current.type === 'listen') { const q = this.current; setTimeout(() => { if (this.current === q && this.state === 'playing') TTS.speak(q.zh); }, 300); }
    return this.current;
  }
  next() { const q = this.request(); if (q && this.game.onQuestion) this.game.onQuestion(q); }
  /** Kiểm tra lựa chọn theo loại câu hỏi */
  check(choice) {
    const q = this.current; if (!q) return false;
    if (q.kind === 'tf') return choice === q.value;
    if (q.kind === 'order') return Array.isArray(choice) && choice.join('\u0001') === q.tokens.join('\u0001');
    if (typeof choice === 'boolean') return choice;
    return choice === q.answer;
  }
  correctText(q = this.current) {
    if (!q) return '';
    if (q.kind === 'tf') return q.value ? 'Đúng' : 'Sai';
    if (q.kind === 'order') return q.tokens.join(' ');
    if (q.correctText) return q.correctText;
    return q.options ? q.options[q.answer] : '';
  }
  choiceText(choice, q = this.current) {
    if (choice == null) return '(không trả lời)';
    if (q.kind === 'tf') return choice ? 'Đúng' : 'Sai';
    if (Array.isArray(choice)) return choice.join(' ');
    if (typeof choice === 'boolean') return choice ? 'Đạt' : 'Chưa đạt';
    if (typeof choice === 'string') return choice;
    return q.options ? (q.options[choice] != null ? q.options[choice] : String(choice)) : String(choice);
  }
  /**
   * Nộp đáp án. opts: {factor, chosenText, noRetry, reason}
   * Trả về true/false; chỉ ghi điểm một lần cho mỗi câu.
   */
  submit(choice, opts = {}) {
    if (this.state !== 'playing' || this.paused || this.locked || !this.current) return null;
    const ok = opts.ok != null ? opts.ok : this.check(choice);
    this.lastChoice = choice;
    if (!ok && !opts.noRetry && this.attempts < this.cfg.retries) {
      this.attempts++; SFX.play('wrong');
      Room.flash(`Chưa đúng — còn ${this.cfg.retries - this.attempts + 1} lần thử`, 'bad');
      if (this.game.onRetry) this.game.onRetry(choice);
      return false;
    }
    this.record(ok, opts.chosenText != null ? opts.chosenText : this.choiceText(choice), opts);
    return ok;
  }
  record(ok, chosenText, opts = {}) {
    const sc = S.settings.scoring; const p = this.player; const q = this.current;
    const t = performance.now() - this.qStart; const limit = this.cfg.timePerQ * 1000;
    let points = 0;
    if (ok) {
      p.combo++;
      const speed = Math.round(sc.speedMax * clamp(1 - t / limit, 0, 1));
      const combo = Math.min(p.combo - 1, sc.comboMax) * sc.comboStep;
      points = Math.round((sc.correct + speed + combo) * (opts.factor != null ? opts.factor : 1) * (this.attempts ? sc.retryFactor : 1));
    } else p.combo = 0;
    p.score += points; p.total++; if (ok) p.correct++;
    this.records.push({ player: p.name, studentId: p.studentId || null, qid: q.id, prompt: [q.stem, q.zh].filter(Boolean).join(' — '), zh: q.zh, pinyin: q.pinyin, vi: q.vi, chosen: chosenText, correct: this.correctText(q), ok, timeMs: Math.round(t), points, at: Date.now(), reason: opts.reason || '', explanation: q.explanation || '' });
    this.locked = true;
    SFX.play(ok ? 'correct' : (opts.reason === 'Hết giờ' ? 'timeout' : 'wrong'));
    if (ok && points >= sc.correct + sc.comboStep * 2) Fx.confetti(30);
    Room.hud();
    this.feedback(ok, points, opts.reason);
  }
  bonus(points, label) { const p = this.player; p.score += points; this.records.push({ player: p.name, studentId: p.studentId || null, bonus: true, prompt: label, points, ok: true, at: Date.now() }); SFX.play('bonus'); Room.flash(`+${points} ${label}`, 'ok'); Room.hud(); }
  feedback(ok, points, reason) {
    const q = this.current; const explain = this.cfg.explain && q.explanation;
    Room.showFeedback(ok, points, reason, this.correctText(q), explain ? q.explanation : '', this.cfg.autoNext);
    clearTimeout(this.fbTimer);
    if (this.cfg.autoNext) this.fbTimer = setTimeout(() => this.continue(), ok ? (explain ? 2600 : 1300) : (explain ? 4200 : 2600));
  }
  continue() {
    clearTimeout(this.fbTimer); if (this.state !== 'playing') return;
    Room.hideOverlay();
    if (this.players.length > 1 && !this.overridePlayer) this.turn++;
    this.overridePlayer = null;
    if (this.def.manual) { this.current = null; this.locked = false; Room.banner(null); if (this.game.onFeedbackDone) this.game.onFeedbackDone(); }
    else this.next();
  }
  timeout() { if (this.locked) return; this.submit(null, { ok: false, noRetry: true, reason: 'Hết giờ' }); }
  skip() { if (!this.current || this.locked) return; this.submit(null, { ok: false, noRetry: true, reason: 'Bỏ qua', chosenText: '(bỏ qua)' }); }
  reveal() { if (!this.current || this.locked) return; this.revealed = true; this.submit(null, { ok: false, noRetry: true, reason: 'Giáo viên công bố đáp án', chosenText: '(công bố đáp án)' }); }

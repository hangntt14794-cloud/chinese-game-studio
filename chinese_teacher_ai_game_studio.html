/* =====================================================================
   CHUẨN BỊ CÂU HỎI CHO TỪNG LOẠI TRÒ CHƠI
   ===================================================================== */
function emojiFor(zh) { const v = S.vocab.find(x => x.hanzi === zh && x.emoji); return v ? v.emoji : ''; }
function dictSet() { return new Set([...Core.COMMON_WORDS, ...S.vocab.map(v => v.hanzi)]); }
function vocabPool(qs) {
  const m = new Map();
  qs.forEach(q => Core.vocabFromQ(q).forEach(v => { if (v.zh && !m.has(v.zh)) m.set(v.zh, v); }));
  return [...m.values()];
}
/**
 * Chuyển câu hỏi trong bộ đề sang dạng trò chơi cần.
 * Trả về {items, notes}. Không tạo nội dung mới ngoài dữ liệu đã có
 * (ngoại trừ phương án nhiễu thanh điệu cho trò pinyin và dữ liệu tư thế có sẵn).
 */
function prepareItems(def, qs, cfg) {
  const notes = []; let items = [];
  const kind = def.kind; const maxOpt = def.maxOpt || 4;
  const ord = (arr) => cfg.shuffle ? shuffle(arr) : arr;
  const pool = vocabPool(qs);
  const allPool = vocabPool(S.questions).concat(S.vocab.map(v => ({ zh: v.hanzi, py: v.pinyin, vi: v.vi, hsk: v.hsk })));
  switch (kind) {
    case 'mcq': items = qs.map(q => Core.asMCQ(q, maxOpt)).filter(Boolean); if (def.needZh) items = items.filter(q => q.zh && !q.hide.includes('zh')).concat(items.filter(q => !(q.zh && !q.hide.includes('zh')))); break;
    case 'tf': items = qs.map(q => { const t = Core.asTF(q); return t ? { ...t, _w: wordOf({ ...q, kind: 'mcq' }) } : null; }).filter(Boolean); break;
    case 'order': { const ds = dictSet(); items = qs.map(q => { const o = Core.asOrder(q, ds); return o ? { ...o, _w: q.type === 'order' ? '' : wordOf({ ...q, kind: 'mcq' }) } : null; }).filter(Boolean); break; }
    case 'match': {
      const mpool = cfg.shuffle ? shuffle(pool) : pool;
      const groups = qs.filter(q => q.type === 'match' && q.pairs.length >= 2).map(q => ({ ...q, kind: 'match', pairs: q.pairs.filter(p => p.zh && p.py).slice(0, 5) }));
      const loose = mpool.filter(v => v.py && !groups.some(g => g.pairs.some(p => p.zh === v.zh)));
      for (let i = 0; i + 2 < loose.length; i += 4) { const g = loose.slice(i, i + 4); if (g.length >= 3) groups.push({ id: 'mg_' + i, kind: 'match', type: 'match', stem: 'Kéo pinyin vào đúng chữ Hán', zh: '', pairs: g.map(v => ({ zh: v.zh, py: v.py, vi: v.vi })), hsk: g[0].hsk, explanation: g.map(v => `${v.zh} = ${v.py}`).join('; '), hide: [] }); }
      items = groups.filter(g => g.pairs.length >= 2); break;
    }
    case 'pinyin': {
      items = qs.filter(q => q.type === 'pinyin').map(q => Core.asMCQ(q, maxOpt)).filter(Boolean);
      pool.filter(v => v.py && !items.some(i => i.zh === v.zh)).forEach(v => {
        const others = allPool.filter(o => o.py && o.py !== v.py).map(o => o.py);
        const m = Core.buildMCQ(v.py, [...Core.toneVariants(v.py, 3), ...shuffle(others)], maxOpt);
        if (m) items.push({ id: 'py_' + v.zh, kind: 'mcq', type: 'pinyin', stem: 'Bắn bong bóng có pinyin đúng', zh: v.zh, pinyin: v.py, vi: v.vi, ...m, hide: ['pinyin'], explanation: `${v.zh} đọc là ${v.py}${v.vi ? ' — ' + v.vi : ''}`, hsk: v.hsk || 1 });
      });
      break;
    }
    case 'tone': {
      const TONE_LABEL = ['Thanh 1 ˉ', 'Thanh 2 ˊ', 'Thanh 3 ˇ', 'Thanh 4 ˋ'];
      pool.forEach(v => { const t = Core.toneOfFirst(v.py); if (!t) return; const first = Core.splitSyllables(v.py)[0]; items.push({ id: 'tone_' + v.zh, kind: 'mcq', type: 'tone', stem: `Thanh điệu của âm tiết đầu tiên “${v.zh[0]}” là thanh mấy?`, zh: v.zh, pinyin: v.py, vi: v.vi, options: TONE_LABEL.slice(), answer: t - 1, hide: ['pinyin'], speak: v.zh, explanation: `${v.zh[0]} đọc là ${first} → thanh ${t}. (${v.zh} = ${v.py})`, hsk: v.hsk || 1 }); });
      break;
    }
    case 'char': {
      const seen = new Set();
      [...pool, ...qs.filter(q => q.zh && Core.hanCount(q.zh) <= 2 && /^[\u3400-\u9fff]+$/.test(q.zh)).map(q => ({ zh: q.zh, py: q.pinyin, vi: q.vi, hsk: q.hsk }))].forEach(v => {
        if (!v.zh || seen.has(v.zh) || Core.hanCount(v.zh) > 2 || !/^[\u3400-\u9fff]+$/.test(v.zh)) return; seen.add(v.zh);
        items.push({ id: 'ch_' + v.zh, kind: 'char', type: 'char', stem: 'Vẽ chữ Hán theo mẫu', zh: v.zh, pinyin: v.py, vi: v.vi, hide: [], correctText: v.zh, explanation: `${v.zh}${v.py ? ' (' + v.py + ')' : ''}${v.vi ? ' — ' + v.vi : ''}`, hsk: v.hsk || 1 });
      });
      break;
    }
    case 'picture': {
      const pics = uniq([...pool.map(v => v.zh), ...allPool.map(v => v.zh)]).map(zh => { const v = pool.find(p => p.zh === zh) || allPool.find(p => p.zh === zh); return { ...v, emoji: emojiFor(zh) }; }).filter(v => v.emoji);
      const own = pics.filter(p => pool.some(v => v.zh === p.zh));
      const base = own.length ? own : pics.filter(p => !cfg.hsk || p.hsk <= (cfg.hsk || 6));
      if (!own.length) notes.push('Bộ đề không có từ vựng có hình minh họa — dùng từ vựng mẫu có hình.');
      base.forEach(v => {
        const others = shuffle(pics.filter(p => p.zh !== v.zh)).slice(0, 3);
        if (others.length < 1) return;
        const options = shuffle([v, ...others]);
        items.push({ id: 'pic_' + v.zh, kind: 'mcq', type: 'picture', stem: cfg.pictureOnly ? 'Nghe và chỉ vào hình đúng' : 'Chỉ vào hình đúng với từ', zh: v.zh, pinyin: v.py, vi: v.vi, options: options.map(o => o.zh), pics: options.map(o => o.emoji), answer: options.indexOf(v), hide: cfg.pictureOnly ? ['vi', 'zh'] : ['vi'], speak: v.zh, correctText: `${v.emoji} ${v.zh}`, explanation: `${v.zh}${v.py ? ' (' + v.py + ')' : ''} = ${v.vi}`, hsk: v.hsk || 1 });
      });
      break;
    }
    case 'pose': items = POSES.map(p => ({ ...p, kind: 'pose', type: 'pose', stem: 'Làm động tác đúng với từ', hide: [], correctText: p.zh, explanation: `${p.zh} (${p.pinyin}) = ${p.vi}. ${p.desc}`, speak: p.zh })); break;
    default: items = [];
  }
  const limit = cfg.count || items.length;
  // Chống lặp dùng chung cho mọi trò: ưu tiên câu/từ chưa chơi, cân bằng dạng câu hỏi
  if (cfg.usageKey && cfg.noRepeat !== false && kind !== 'pose') items = pickFresh(items, limit, S.usage[cfg.usageKey]);
  else items = ord(items);
  if (kind === 'pose') { const base = items.slice(); while (items.length < Math.min(limit, 10)) items.push(...shuffle(base).map(x => ({ ...x }))); }
  items = items.slice(0, limit);
  // Dàn đều: tránh hai câu liên tiếp hỏi cùng một từ (khi có thể)
  if (cfg.shuffle && items.length > 2) { const rest = items.slice(); const out = []; while (rest.length) { const prev = out[out.length - 1]; let k = prev ? rest.findIndex(x => (x.zh || x.stem) !== (prev.zh || prev.stem) && !(prev.zh && x.zh && (x.zh.includes(prev.zh) || prev.zh.includes(x.zh)))) : 0; if (k < 0) k = 0; out.push(rest.splice(k, 1)[0]); } items = out; }
  items = items.map((it, i) => ({ ...it, _n: i }));
  // Đổi vị trí đáp án mỗi lượt (không áp dụng cho Đúng/Sai và thanh điệu vì thứ tự cố định)
  if (cfg.reshuffle) items = items.map(it => {
    if (it.kind !== 'mcq' || !it.options || it.options.length < 2 || ['tf', 'tone'].includes(it.type)) return it;
    const order = shuffle(it.options.map((_, i) => i));
    return { ...it, options: order.map(i => it.options[i]), pics: it.pics ? order.map(i => it.pics[i]) : it.pics, answer: order.indexOf(it.answer) };
  });
  return { items, notes };
}


/* ---------- Bộ nhớ chống lặp dùng chung cho mọi trò chơi ---------- */
/** Từ vựng chính mà một câu hỏi kiểm tra (dùng để tránh hỏi lại cùng một từ) */
function wordOf(it) {
  if (it._w) return it._w;
  if (it.kind === 'match') return it.pairs.map(p => p.zh).join(',');
  if (it.kind === 'pose') return it.zh;
  const zh = String(it.zh || ''); const ans = it.options && it.answer >= 0 ? String(it.options[it.answer] || '') : '';
  const m = zh.match(/「(.+?)」/); if (m) return m[1];
  if (zh && Core.hanCount(zh) <= 6 && !/[。！？，_→]/.test(zh)) return zh;
  if (ans && Core.hanCount(ans) >= 1 && Core.hanCount(ans) <= 6 && !/[。！？]/.test(ans)) return ans;
  return zh || it.stem || '';
}
/**
 * Chọn câu cho một lượt: câu chưa từng chơi trước, rồi tới câu chơi lâu nhất;
 * trong lượt không lặp từ (khi còn từ khác) và chia đều các dạng câu hỏi,
 * ưu tiên dạng ít được chơi trong các lượt trước.
 */
function pickFresh(items, limit, u) {
  u = u || { q: {}, w: {}, t: {} };
  const qT = (it) => u.q[itemKey(it)] || 0, wT = (it) => u.w[wordOf(it)] || 0;
  const histTotal = Object.values(u.t || {}).reduce((a, b) => a + b, 0) || 1;
  let pool = shuffle(items).sort((a, b) => (qT(a) - qT(b)) || (wT(a) - wT(b)));
  const out = [], usedW = new Set(), tc = {};
  while (out.length < limit && pool.length) {
    let best = 0, bestS = Infinity; const win = Math.min(pool.length, 250);
    const typeCap = Math.max(2, Math.ceil(limit / Math.max(1, uniq(items.map(x => x.type)).length)) + 1);
    for (let i = 0; i < win; i++) {
      const it = pool[i]; const c = tc[it.type] || 0;
      // phạt: lặp từ trong lượt > câu đã chơi > dạng vượt mức chia đều > từ đã gặp ở lượt trước > dạng đã chơi nhiều trong quá khứ
      const sc = (usedW.has(wordOf(it)) ? 1000 : 0) + (qT(it) ? 500 : 0) + (c >= typeCap ? 120 : c * 10) + (wT(it) ? 60 : 0) + ((u.t || {})[it.type] || 0) / histTotal * 8 + i * .02;
      if (sc < bestS) { bestS = sc; best = i; }
    }
    const it = pool.splice(best, 1)[0]; out.push(it); usedW.add(wordOf(it)); tc[it.type] = (tc[it.type] || 0) + 1;
  }
  return out;
}
function recordUsage(key, items) {
  const u = S.usage[key] || (S.usage[key] = { q: {}, w: {}, t: {}, plays: 0 }); const now = Date.now();
  items.forEach(it => { u.q[itemKey(it)] = now; u.w[wordOf(it)] = now; u.t[it.type] = (u.t[it.type] || 0) + 1; });
  u.plays = (u.plays || 0) + 1;
  const trim = (o, max) => { const ks = Object.keys(o); if (ks.length > max) ks.sort((a, b) => o[a] - o[b]).slice(0, ks.length - max).forEach(k => delete o[k]); };
  trim(u.q, 5000); trim(u.w, 3000);
  Store.save('usage');
}

/* =====================================================================
   20 TRÒ CHƠI — mỗi trò có logic riêng, dùng Session để chấm điểm.
   Mọi trò đều nhận đầu vào chung từ Room.input(): con trỏ (ngón tay hoặc
   chuột), click/chụm ngón, phím bấm và dữ liệu tay/mặt/cơ thể nếu có.
   ===================================================================== */
const KIND_LABEL = { mcq: 'Trắc nghiệm', tf: 'Đúng/Sai', order: 'Sắp xếp câu', match: 'Nối pinyin – chữ Hán', pinyin: 'Chọn pinyin', tone: 'Thanh điệu', char: 'Chữ Hán để vẽ', picture: 'Từ vựng có hình', pose: 'Động từ hành động' };
function defGame(o) { GAMES.push({ levels: 'HSK 1–6', color: '#d9f6f2', models: [], pointer: 'tip', ...o, kindLabel: KIND_LABEL[o.kind] }); }
/** Trạng thái tô màu ô đáp án sau khi đã trả lời */
function zState(s, i) {
  if (!s.locked || !s.current) return '';
  const q = s.current; const ans = q.kind === 'tf' ? (q.value ? 0 : 1) : q.answer;
  const last = q.kind === 'tf' ? (s.lastChoice === true ? 0 : s.lastChoice === false ? 1 : null) : s.lastChoice;
  return i === ans ? 'ok' : i === last ? 'bad' : '';
}
const handPtr = (inp) => (inp.pointer && inp.pointer.src === 'hand' ? inp.pointer : null);
const ptrOrMouse = (inp) => inp.pointer || null;
/** Chọn bằng dwell (tay) + click/chụm + phím: dùng cho nhiều trò */
function zonePicker(s) {
  const dw = new Dwell();
  return {
    dw, hover: null, prog: { zone: null, p: 0 },
    update(dt, inp, zones, onPick, useDwell = true) {
      if (s.locked) { this.prog = { zone: null, p: 0 }; return; }
      this.hover = zoneAt(inp.pointer, zones);
      this.prog = useDwell && handPtr(inp) ? this.dw.update(this.hover, dt) : { zone: null, p: 0 };
      if (this.prog.done) return onPick(this.prog.zone);
      const c = zoneAt(inp.click, zones); if (c != null) onPick(c);
    },
  };
}
function picturePool(s) {
  const qs = s.cfg.sourceQuestions || [];
  const own = vocabPool(qs).map(v => ({ ...v, emoji: emojiFor(v.zh) })).filter(v => v.emoji);
  const all = S.vocab.filter(v => v.emoji).map(v => ({ zh: v.hanzi, py: v.pinyin, vi: v.vi, emoji: v.emoji, hsk: v.hsk }));
  return { own, all };
}
function drawEmoji(ctx, e, x, y, size) { ctx.save(); ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); ctx.restore(); }
/** Cổng đáp án chạy dọc/ngang tới người chơi (dùng cho các trò làn đường) */
function travelTime(s) { return clamp(s.cfg.timePerQ * .7, 3.5, 12) / (1 + Math.min(s.idx, 15) * .02); }

/* ---------- 2. Head Tilt True/False ---------- */
defGame({
  id: 'head-tilt', num: 2, icon: '🙆', color: '#efecfe', name: 'Nghiêng đầu Đúng/Sai', models: ['face'], kind: 'tf',
  desc: 'Đọc nhận định tiếng Trung. Nghiêng đầu sang trái là Đúng, sang phải là Sai.',
  how: 'Ngồi thẳng, bấm “Hiệu chỉnh đầu thẳng”. Nghiêng đầu sang trái (theo hình trên màn hình) để chọn Đúng, sang phải để chọn Sai, giữ khoảng 1 giây.',
  controls: 'Face Landmarker đo góc nghiêng từ hai khóe mắt; ngưỡng góc chỉnh trong Cài đặt.', fallback: 'Phím ← (Đúng) / → (Sai), hoặc bấm vào ô.',
  extra: () => `<button class="btn sm" id="calTilt">Hiệu chỉnh đầu thẳng</button><p class="tiny muted">Ngưỡng nghiêng hiện tại: ${S.settings.tiltDeg}° (đổi trong Cài đặt).</p>`,
  create: (s) => {
    const dw = new Dwell(1000); let zones = [], prog = { zone: null, p: 0 }, neutral = 0, roll = null, hover = null;
    return {
      bindExtra(el) { $('#calTilt', el).onclick = () => { const f = Tracker.st.face; if (f && f.present) { neutral = f.roll; toast('Đã ghi nhận tư thế đầu thẳng.', 'ok'); } else toast('Chưa thấy khuôn mặt. Bật camera và ngồi chính diện.', 'warn'); }; },
      onQuestion: () => dw.reset(),
      update(dt, inp) {
        const q = s.current; const h = inp.H - inp.top - 100; zones = [{ x: 14, y: inp.top + 10, w: inp.W * .28, h }, { x: inp.W * .72 - 14, y: inp.top + 10, w: inp.W * .28, h }];
        if (!q || s.locked) return;
        let z = null;
        if (inp.face && inp.face.present) { roll = inp.face.roll - neutral; const thr = S.settings.tiltDeg / S.settings.sensitivity; z = roll < -thr ? 0 : roll > thr ? 1 : null; } else roll = null;
        prog = dw.update(z, dt); if (prog.done) return s.submit(prog.zone === 0);
        hover = zoneAt(inp.pointer, zones); const c = zoneAt(inp.click, zones); if (c != null) s.submit(c === 0);
      },
      draw(ctx, W, H) {
        if (!s.current) return;
        Draw.zone(ctx, zones[0], '', '✓ ĐÚNG', prog.zone === 0 ? prog.p : 0, zState(s, 0), hover === 0); Draw.zone(ctx, zones[1], '', '✗ SAI', prog.zone === 1 ? prog.p : 0, zState(s, 1), hover === 1);
        Draw.label(ctx, '← nghiêng trái', zones[0].x + zones[0].w / 2, zones[0].y + zones[0].h - 26, 13); Draw.label(ctx, 'nghiêng phải →', zones[1].x + zones[1].w / 2, zones[1].y + zones[1].h - 26, 13);
        // đồng hồ góc nghiêng
        const cx = W / 2, cy = H - 26, r = 70; ctx.save(); ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        const thr = S.settings.tiltDeg / S.settings.sensitivity;
        [-thr, thr].forEach(t => { const a = Math.PI * 1.5 + t / 40 * Math.PI * .35 / .5 * .5; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12)); ctx.lineTo(cx + Math.cos(a) * (r + 12), cy + Math.sin(a) * (r + 12)); ctx.stroke(); });
        if (roll != null) { const a = Math.PI * 1.5 + clamp(roll, -40, 40) / 40 * Math.PI * .35; ctx.strokeStyle = '#0fb3a3'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke(); }
        ctx.restore(); Draw.label(ctx, roll == null ? (Cam.ready() ? 'Không thấy khuôn mặt' : 'Camera tắt — dùng phím ← →') : `Nghiêng ${Math.round(roll)}°`, cx, cy - r - 14, 13);
      },
      onKey(e) { if (['ArrowLeft', '1', 'd', 'D'].includes(e.key)) { s.submit(true); return true; } if (['ArrowRight', '2', 's', 'S'].includes(e.key)) { s.submit(false); return true; } return false; },
    };
  },
});

/* ---------- 3. Chinese Character Catching ---------- */
defGame({
  id: 'apple-catch', num: 3, icon: '🍎', color: '#fde6e6', name: 'Bắt táo chữ Hán', models: ['hand'], kind: 'mcq', pointer: 'palm',
  desc: 'Những quả táo mang đáp án rơi xuống. Di chuyển giỏ bằng bàn tay để bắt đúng quả.',
  how: 'Đọc câu hỏi ở trên, di chuyển bàn tay sang trái/phải để giỏ hứng quả táo có đáp án đúng. Táo rơi nhanh dần theo cấp độ.',
  controls: 'Tâm bàn tay (MediaPipe Hands) điều khiển giỏ.', fallback: 'Di chuột/chạm để di chuyển giỏ, hoặc phím ← →; phím 1–4 để chọn nhanh.',
  create: (s) => {
    let apples = [], bx = .5;
    const speed = () => .085 * (1 + ((s.cfg.hsk || 1) - 1) * .12) * (1 + Math.min(s.idx, 20) * .025);
    return {
      onQuestion(q) { const lanes = shuffle(q.options.map((_, i) => i)); apples = q.options.map((o, i) => ({ i, lane: lanes[i], y: -.12 - Math.random() * .4, v: speed() * (.85 + Math.random() * .3), done: false })); },
      update(dt, inp) {
        const q = s.current; if (!q) return;
        if (inp.pointer) bx = clamp(inp.pointer.x / inp.W, .06, .94);
        if (inp.keys.has('ArrowLeft')) bx = clamp(bx - dt * .8, .06, .94); if (inp.keys.has('ArrowRight')) bx = clamp(bx + dt * .8, .06, .94);
        if (s.locked) return;
        const n = q.options.length, bw = Math.min(.2, 1 / (n + .5));
        apples.forEach(a => {
          a.y += a.v * dt;
          const ax = (a.lane + .5) / n; const top = inp.top / inp.H;
          if (a.y > .8 && a.y < .92 && Math.abs(ax - bx) < bw * .55) { a.done = true; s.submit(a.i); }
          if (a.y > 1.08) { a.y = top - .05 - Math.random() * .1; a.v = speed() * (.85 + Math.random() * .3); }
        });
      },
      draw(ctx, W, H) {
        const q = s.current; if (!q) return; const n = q.options.length; const r = Math.min(W / (n * 2.6), 74);
        apples.forEach(a => {
          const x = (a.lane + .5) / n * W, y = a.y * H; if (y < -r) return;
          const st = zState(s, a.i);
          ctx.save(); ctx.fillStyle = st === 'ok' ? '#14a058' : st === 'bad' ? '#9aa' : '#e23d3d'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
          ctx.fillStyle = '#3e9b3e'; ctx.beginPath(); ctx.ellipse(x + r * .25, y - r * 1.02, r * .28, r * .12, -.5, 0, 7); ctx.fill(); ctx.restore();
          Draw.fit(ctx, q.options[a.i], x, y, r * 1.6, r * 1.3, r * .7, '#fff');
        });
        const bw = Math.min(.2, 1 / (n + .5)) * W, by = H * .86;
        ctx.save(); ctx.fillStyle = '#a0682b'; Draw.rr(ctx, bx * W - bw / 2, by, bw, H * .1, 14); ctx.fill(); ctx.strokeStyle = '#7a4c1c'; ctx.lineWidth = 3; for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(bx * W - bw / 2 + 8, by + k * H * .025); ctx.lineTo(bx * W + bw / 2 - 8, by + k * H * .025); ctx.stroke(); } ctx.restore();
      },
      onKey(e) { const k = keyIndex(e); if (k != null && s.current && k < s.current.options.length) { s.submit(k); return true; } return ['ArrowLeft', 'ArrowRight'].includes(e.key); },
    };
  },
});

  create: (s) => {
    let left = [], right = [], grab = null, mistakes = 0, wrongFlash = 0, matched = 0;
    const layout = (W, H, top) => {
      const n = left.length; const h = Math.min(78, (H - top - 30) / n - 10); const w = W * .3;
      left.forEach((c, i) => Object.assign(c, { x: W * .08, y: top + 10 + i * (h + 10), w, h }));

      const L = left.find(l => !l.done && inRect(p, l));

      else { mistakes++; c.miss = true; wrongFlash = .5; L.wrong = .5; SFX.play('wrong'); }
      grab = null;

    };

      update(dt, inp) {
        if (!s.current) return; layout(inp.W, inp.H, inp.top); wrongFlash = Math.max(0, wrongFlash - dt); left.forEach(l => { if (l.wrong) l.wrong = Math.max(0, l.wrong - dt); });
        if (s.locked) return;
        const p = inp.pointer; const holding = p && (p.src === 'hand' ? inp.pinch : inp.mouseDown);
        if (!grab && holding && (inp.pinchStart || (p.src === 'mouse' && inp.click))) { const c = right.find(r => !r.done && inRect(p, r)); if (c) { grab = c; c.ox = p.x - c.x; c.oy = p.y - c.y; SFX.play('select'); } }
        if (grab && p) { grab.x = p.x - grab.ox; grab.y = p.y - grab.oy; }
        if (grab && !holding) drop(grab, p || { x: grab.x + grab.w / 2, y: grab.y + grab.h / 2 });
      },
      draw(ctx, W, H, inp) {
        if (!s.current) return;
        left.forEach(c => { Draw.zone(ctx, c, '', c.zh, 0, c.done ? 'ok' : c.wrong ? 'bad' : '', false); });
        right.filter(c => c !== grab).forEach(c => Draw.zone(ctx, c, '', c.py, 0, c.done ? 'ok' : '', false));
        if (grab) { ctx.save(); ctx.globalAlpha = .95; Draw.zone(ctx, grab, '', grab.py, 0, '', true); ctx.restore(); }
        Draw.cursor(ctx, handPtr(inp), 0, '#0fb3a3', inp.pinch);
        Draw.label(ctx, `Đã nối ${matched}/${left.length} · Sai ${mistakes}`, W / 2, H - 18, 14);
      },
    };
  },
});

/* ---------- 13. Grammar Fruit Ninja ---------- */
defGame({
  id: 'fruit-ninja', num: 13, icon: '🍉', color: '#dcf7e8', name: 'Chém hoa quả ngữ pháp', models: ['hand'], kind: 'order', timeDefault: 40,
  desc: 'Các mảnh câu bay lên trên hoa quả. Quẹt tay chém đúng thứ tự để ghép thành câu đúng ngữ pháp.',
  how: 'Quẹt nhanh đầu ngón trỏ qua quả mang mảnh câu tiếp theo. Chém sai thứ tự sẽ bị tính lỗi; quá 2 lỗi thì mất lượt. Sau mỗi câu có giải thích trật tự từ.',
  controls: 'MediaPipe Hands: tốc độ di chuyển đầu ngón trỏ đủ nhanh và cắt qua quả thì tính là một nhát chém.', fallback: 'Giữ chuột và quẹt qua quả, hoặc bấm trực tiếp vào quả.',
  create: (s) => {
    let fruits = [], progress = 0, built = [], mistakes = 0, prev = null, trail = [], tokens = [];
    const FR = ['🍉', '🍊', '🍎', '🍍', '🥝', '🍑', '🍋', '🍇'];
    const toss = (f, W, H, delay = 0) => Object.assign(f, { x: W * (.15 + Math.random() * .7), y: H + 60, vx: (Math.random() - .5) * W * .25, vy: -(H * (1.05 + Math.random() * .25)), wait: delay, hit: 0 });
    return {
      onQuestion(q) { tokens = q.tokens; progress = 0; built = []; mistakes = 0; fruits = shuffle(tokens.map((t, i) => ({ t, i, e: FR[i % FR.length], cut: false }))); fruits.forEach((f, k) => toss(f, Room.W, Room.H, k * .55)); },
      update(dt, inp) {
        if (!s.current) return; const W = inp.W, H = inp.H; const g = H * 1.1;
        fruits.forEach(f => { if (f.cut) { f.cut += dt; return; } if (f.wait > 0) { f.wait -= dt; return; } f.x += f.vx * dt; f.y += f.vy * dt; f.vy += g * dt; f.hit = Math.max(0, f.hit - dt); if (f.y > H + 80 && f.vy > 0) toss(f, W, H, .3 + Math.random() * .6); });
        const p = inp.pointer; const now = inp.t;
        if (p) { trail.push({ x: p.x, y: p.y, t: now }); } trail = trail.filter(e => now - e.t < 180);
        if (s.locked) { prev = p; return; }
        const r = Math.min(W, H) * .07;
        const trySlice = (f) => {
          if (f.cut || f.wait > 0 || f.hit) return;
          if (f.t === tokens[progress]) { f.cut = .001; progress++; built.push(f.t); SFX.play('slice'); if (progress >= tokens.length) s.submit(built.slice(), { ok: mistakes <= 1, chosenText: built.join(' ') + (mistakes ? ` (${mistakes} lỗi)` : ''), factor: 1 - mistakes * .3, noRetry: true }); }
          else { f.hit = .5; mistakes++; SFX.play('wrong'); f.vy = -Math.abs(f.vy) * .3; if (mistakes > 2) s.submit(built.concat([f.t]), { ok: false, noRetry: true, chosenText: built.concat([f.t]).join(' ') + ' (sai thứ tự)' }); }
        };
        if (p && prev) {
          const speed = Math.hypot(p.x - prev.x, p.y - prev.y) / (dt || .016) / W; const need = (p.src === 'mouse' ? .5 : 1.0) / S.settings.sensitivity;
          if (speed > need && (p.src === 'hand' || inp.mouseDown)) fruits.forEach(f => { const dx = p.x - prev.x, dy = p.y - prev.y; const L = dx * dx + dy * dy || 1; const tt = clamp(((f.x - prev.x) * dx + (f.y - prev.y) * dy) / L, 0, 1); if (Math.hypot(prev.x + tt * dx - f.x, prev.y + tt * dy - f.y) < r) trySlice(f); });
        }
        if (inp.click) { const f = fruits.find(f => !f.cut && f.wait <= 0 && Math.hypot(inp.click.x - f.x, inp.click.y - f.y) < r); if (f) trySlice(f); }
        prev = p;
      },
      draw(ctx, W, H) {
        if (!s.current) return; const r = Math.min(W, H) * .07;
        fruits.forEach(f => {
          if (f.wait > 0) return;
          if (f.cut) { if (f.cut > .5) return; ctx.save(); ctx.globalAlpha = 1 - f.cut * 2; drawEmoji(ctx, f.e, f.x - f.cut * 120, f.y + f.cut * 80, r * 1.6); drawEmoji(ctx, f.e, f.x + f.cut * 120, f.y + f.cut * 80, r * 1.6); ctx.restore(); return; }
          drawEmoji(ctx, f.e, f.x, f.y, r * 1.9); Draw.label(ctx, f.t, f.x, f.y + r * 1.1, Math.max(14, r * .42), f.hit ? 'rgba(225,72,77,.95)' : 'rgba(255,255,255,.95)', f.hit ? '#fff' : '#123540');
        });
        if (trail.length > 1) { ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.beginPath(); trail.forEach((e, i) => i ? ctx.lineTo(e.x, e.y) : ctx.moveTo(e.x, e.y)); ctx.stroke(); ctx.restore(); }
        const shown = tokens.map((t, i) => (i < progress ? t : '＿')).join(' ');
        Draw.label(ctx, shown, W / 2, H - 22, 20); Draw.label(ctx, `Lỗi: ${mistakes}/2`, W - 70, H - 22, 13);
      },
    };
  },
});

defGame({
  id: 'mouth-tracker', num: 14, icon: '🐤', color: '#fff3d6', name: 'Khẩu hình bay qua cổng', models: ['face'], kind: 'mcq', maxOpt: 3,
  desc: 'Há miệng để chim bay lên, ngậm miệng để hạ xuống. Bay qua cổng có đáp án đúng.',
  how: 'Bấm hiệu chỉnh “ngậm miệng” và “há miệng” trước khi chơi. Điều khiển độ mở miệng để chú chim bay qua ô cổng có đáp án đúng khi cổng chạy tới.',
  controls: 'Face Landmarker ước lượng độ mở miệng (khoảng cách môi trên – môi dưới).', fallback: 'Giữ phím Space hoặc ↑ để bay lên, hoặc di chuột lên/xuống.',
  note: 'Trò này luyện khẩu hình và phản xạ; Face Landmarker không nhận diện âm thanh hay thanh điệu bạn phát ra.',
  extra: () => `<div class="ctl"><button class="btn sm" id="mClose">😐 Đặt mức ngậm miệng</button><button class="btn sm" id="mOpen">😮 Đặt mức há miệng</button></div><p class="tiny muted" id="mCal">Chưa hiệu chỉnh: dùng mức mặc định.</p>`,
  create: (s) => {
    let by = .5, vy = 0, gx = 1.1, n = 3, mmin = .05, mmax = .6, mouth = null, lost = false;
    const cal = () => { const el = $('#mCal'); if (el) el.textContent = `Ngậm: ${mmin.toFixed(2)} · Há: ${mmax.toFixed(2)}`; };
    return {
      bindExtra(el) { $('#mClose', el).onclick = () => { const f = Tracker.st.face; if (f && f.present) { mmin = f.mouth; cal(); } else toast('Chưa thấy khuôn mặt.', 'warn'); }; $('#mOpen', el).onclick = () => { const f = Tracker.st.face; if (f && f.present) { mmax = Math.max(mmin + .1, f.mouth); cal(); } else toast('Chưa thấy khuôn mặt.', 'warn'); }; },
      onQuestion(q) { n = q.options.length; gx = 1.1; },
      update(dt, inp) {
        if (!s.current) return; const top = inp.top / inp.H;
        if (inp.face && inp.face.present) { lost = false; mouth = clamp((inp.face.mouth - mmin) / Math.max(.05, mmax - mmin), 0, 1); by += ((1 - mouth) * (.95 - top - .05) + top + .05 - by) * Math.min(1, dt * 8); }
        else if (inp.tracking) { lost = true; mouth = null; }
        else if (inp.keys.has(' ') || inp.keys.has('ArrowUp')) { vy = -.55; by += vy * dt; }
        else if (inp.pointer && inp.pointer.src === 'mouse') by += (inp.pointer.y / inp.H - by) * Math.min(1, dt * 8);
        else { vy = Math.min(.45, vy + dt * 1.2); by += vy * dt; }
        by = clamp(by, top + .03, .95);
        if (s.locked || (lost && inp.tracking)) return;
        gx -= dt / travelTime(s) * .88;
        if (gx <= .22) { const band = clamp(Math.floor((by - top) / ((1 - top) / n)), 0, n - 1); s.submit(band); }
      },
      draw(ctx, W, H, inp) {
        const q = s.current; if (!q) return; const top = inp.top; const bh = (H - top) / n;
        q.options.forEach((o, i) => Draw.zone(ctx, { x: gx * W - 90, y: top + i * bh + 6, w: 180, h: bh - 12 }, LETTERS[i], o, 0, zState(s, i)));
        drawEmoji(ctx, '🐤', W * .22, by * H, Math.min(70, H * .12));
        if (lost) Draw.label(ctx, 'Không nhận diện được môi — nhìn thẳng camera, đủ sáng', W / 2, H - 20, 14);
        else Draw.label(ctx, mouth == null ? 'Space/↑ để bay lên' : `Độ mở miệng: ${Math.round(mouth * 100)}%`, W / 2, H - 20, 14);
      },
      onKey(e) { return e.key === ' ' || e.key === 'ArrowUp'; },
    };
  },
});

          if (inp.t - lastCheck > 200) { lastCheck = inp.t; const sm = document.createElement('canvas'); sm.width = 64; sm.height = 32; const sc = sm.getContext('2d'); sc.drawImage(fog, 0, 0, 64, 32); const d = sc.getImageData(0, 0, 64, 32).data; let clear = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 40) clear++; cleared = clear / (64 * 32); if (cleared >= .55) reveal(); }

      update(dt, inp) {

        else rects.forEach((r, i) => {

          const shake = phase === 'opening' && i === openIdx ? Math.sin(anim * 60) * 6 : 0;

    const startMic = async () => {
      if (mic) { stopMic(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); SFX.ensure(); const ctx = SFX.ctx; const src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
        mic = { stream, an, buf: new Float32Array(an.fftSize), prev: 0, cool: 0 }; $('#micBtn').textContent = '🎤 Tắt micro'; $('#micInfo').textContent = 'Micro đang bật: vỗ tay rõ ràng để xác nhận.';

    return {
      bindExtra(el) { $('#micBtn', el).onclick = startMic; },

      update(dt, inp) {
        const q = s.current; if (!q) return; zones = cornerZones(q.options.length, inp.W, inp.H, inp.top); cool = Math.max(0, cool - dt); clapFlash = Math.max(0, clapFlash - dt);

/* =====================================================================

const LESSON_TYPES_DEFAULT = ['meaning', 'hanzi', 'pinyin', 'py2zh', 'listen', 'guess', 'fill', 'order', 'tf', 'match', 'zh2vi', 'vi2zh', 'dialog', 'situation', 'grammar'];
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }

function lessonCompat(l) {

function lessonAfterPlay(l, def, items) {

}

/* =====================================================================
   THƯ VIỆN TRÒ CHƠI — chọn nguồn câu hỏi (bộ đề / bài học / tài liệu /

const matHskCache = new Map();
function materialHsk(m) {
  if (m.analysis && m.analysis.hsk) return m.analysis.hsk;
  if (matHskCache.has(m.id)) return matHskCache.get(m.id);
  let h = 1; try { const dict = {}; S.vocab.forEach(v => { if (!dict[v.hanzi]) dict[v.hanzi] = v.hsk; }); h = Core.analyze(Core.parse(m.text), m.text, dict).hsk; } catch (e) { /* giữ HSK 1 */ }
  matHskCache.set(m.id, h); return h;
}
/** Tài liệu trong kho được dùng như một bài học tạm thời (sinh đề mới mỗi lượt) */
function matLesson(m) { return { id: 'mat_' + m.id, name: m.title, hsk: materialHsk(m), text: m.text, types: LESSON_TYPES_DEFAULT.slice(), difficulty: 'medium', includeInferred: false, count: S.settings.defaults.count, timePerQ: S.settings.defaults.timePerQ, games: [], recent: {}, playsByGame: {}, fromMaterial: true }; }

  const q = norm(libState.q), h = +libState.hsk || 0, tp = libState.topic;
  if (libState.src === 'set') return S.sets.filter(st => (!h || st.hsk === h) && (!q || norm(st.name).includes(q)) && (!tp || st.topic === tp || setQuestions(st).some(x => x.topic === tp)))
    .sort((a, b) => (b.lastUsed || b.createdAt) - (a.lastUsed || a.createdAt)).map(st => ({ id: st.id, name: st.name, hsk: st.hsk, info: `${setQuestions(st).length} câu${st.topic ? ' · ' + st.topic : ''}` }));
  if (libState.src === 'lesson') return S.lessons.filter(l => (!h || l.hsk === h) && (!q || norm(l.name + ' ' + l.text).includes(q)))
    .map(l => { const s2 = lessonStats(l); return { id: l.id, name: l.name, hsk: l.hsk, info: `${s2.vocab} từ · ${s2.sentences} câu` }; });
  if (libState.src === 'material') return S.materials.filter(m => (!h || materialHsk(m) === h) && (!q || norm(m.title + ' ' + m.text).includes(q)))
    .map(m => ({ id: m.id, name: m.title, hsk: materialHsk(m), info: `${Core.hanCount(m.text)} chữ Hán` }));
  return [];
}

  const lastByQ = new Map(); recs.forEach(r => lastByQ.set(r.qid, r.ok));
  return { plays: sessions.length, avg: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0, rate: recs.length ? Math.round(recs.filter(r => r.ok).length / recs.length * 100) : null, learned: lastByQ.size, review: [...lastByQ.values()].filter(v => !v).length, total: scores.reduce((a, b) => a + b, 0) };
}

  });
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
async function boot() {
  Cam.init(); Room.init(); TTS.init(); Gen.loadDraft();
  await Store.open();
  let needLessonSeed = false;
  try {
    for (const k of KEYS) { const v = await Store.get(k); if (k === 'lessons' && v === undefined) needLessonSeed = true; if (v !== undefined) S[k] = k === 'settings' ? mergeDeep(DEFAULT_SETTINGS, v) : v; }
    S.questions = S.questions.map(q => Core.makeQ(q));
  } catch (e) { toast('Không đọc được dữ liệu đã lưu: ' + e.message, 'bad', 7000); }
  if (!S.questions.length && !S.sets.length) { seedData(); for (const k of ['questions', 'vocab', 'sets', 'lessons']) await Store.saveNow(k); }
  if (!Array.isArray(S.lessons)) S.lessons = [];
  if (!S.usage || typeof S.usage !== 'object' || Array.isArray(S.usage)) S.usage = {};
  if (needLessonSeed && !S.lessons.length) { S.lessons.push(sampleLesson()); await Store.saveNow('lessons'); }
  $('#muteBtn').textContent = S.settings.muted ? '🔇' : '🔊';
  $('#muteBtn').onclick = () => { S.settings.muted = !S.settings.muted; $('#muteBtn').textContent = S.settings.muted ? '🔇' : '🔊'; Store.save('settings'); if (!S.settings.muted) { SFX.ensure(); SFX.play('select'); } };
  $('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');
  $('#nav').onclick = (e) => { const b = e.target.closest('[data-page]'); if (b) go(b.dataset.page); };
  document.addEventListener('pointerdown', () => SFX.ensure(), { once: true });
  window.addEventListener('online', renderNav); window.addEventListener('offline', renderNav);
  window.addEventListener('beforeunload', () => { KEYS.forEach(k => { if (Store.timers[k]) { clearTimeout(Store.timers[k]); Store.put(k, k === 'settings' ? settingsForStorage() : S[k]); } }); Cam.stop(); });
  const start = (location.hash || '').slice(1);
  go(Pages[start] && start !== 'room' ? start : 'dashboard');
}
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('afterbegin', `<div class="notice bad" style="margin:10px">Ứng dụng gặp lỗi khi khởi động: ${esc(e.message)}. Hãy tải lại trang; nếu lỗi lặp lại, dùng Cài đặt → Sao lưu rồi xóa dữ liệu.</div>`); });
})();
</script>
